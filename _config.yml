title: Bifrost
author: Andreas Haraldsrud
logo: logo.png

# Build only pages that are explicitly included in _toc.yml.
# This keeps archived and superseded notebooks from generating warnings.
only_build_toc_files: true

execute:
  execute_notebooks: auto

bibtex_bibfiles:
  - references.bib

repository:
  url: https://github.com/andreasdh/bifrost
  path_to_book: docs
  branch: main

html:
  use_issues_button: false
  use_repository_button: false
  extra_css:
    - _static/custom.css

parse:
  myst_enable_extensions:
    - colon_fence
    - dollarmath
