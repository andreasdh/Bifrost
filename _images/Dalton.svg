<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 700.38 350" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Illustrasjon av partialtrykk i en gassblanding</title>
<desc>En beholder med like mange lette H₂-molekyler og tunge CO₂-molekyler. Fartspilene viser at H₂-molekylene beveger seg omtrent 4,7 ganger raskere enn CO₂-molekylene ved samme temperatur. Stolpediagrammet viser at partialtrykkene er like store når stoffmengden er lik, uavhengig av molekylmasse.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .tittel { font-size: 14px; font-weight: 500; fill: #0B0B0B; }
  .etikett { font-size: 12px; fill: #52514E; }
  .h2 { fill: #378ADD; }
  .co2 { fill: #D85A30; }
  .pil-h2 { fill: none; stroke: #378ADD; stroke-width: 1; }
  .pil-co2 { fill: none; stroke: #D85A30; stroke-width: 1; }
  .ramme { fill: none; stroke: #898781; stroke-width: 1.5; }
  .tynn { fill: none; stroke: #898781; stroke-width: 0.5; }
</style>
<defs><marker id="pil-bla" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="pil-oransje" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="pil-gra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tittel" x="225" y="34" text-anchor="middle">Beholder med to gasser</text>
<rect class="ramme" x="60" y="50" width="330" height="260" rx="8"/>
<line x1="390" y1="80" x2="390" y2="280" stroke="#184F95" stroke-width="2" opacity="0.5"/>
<text class="etikett" x="380" y="69" text-anchor="end">alle molekyler treffer veggen</text>
<g class="h2"><circle cx="120" cy="100" r="5"/><circle cx="200" cy="140" r="5"/><circle cx="150" cy="220" r="5"/><circle cx="300" cy="180" r="5"/><circle cx="110" cy="260" r="5"/><circle cx="330" cy="240" r="5"/></g>
<g class="co2"><circle cx="180" cy="180" r="9"/><circle cx="270" cy="230" r="9"/><circle cx="100" cy="160" r="9"/><circle cx="320" cy="100" r="9"/><circle cx="220" cy="275" r="9"/><circle cx="235" cy="95" r="9"/></g>
<line class="pil-h2" x1="125.4" y1="96.4" x2="158.6" y2="74.0" marker-end="url(#pil-bla)"/>
<line class="pil-h2" x1="193.9" y1="137.8" x2="156.3" y2="124.1" marker-end="url(#pil-bla)"/>
<line class="pil-h2" x1="143.7" y1="221.7" x2="105.1" y2="232.0" marker-end="url(#pil-bla)"/>
<line class="pil-h2" x1="305.6" y1="176.8" x2="340.3" y2="156.8" marker-end="url(#pil-bla)"/>
<line class="pil-h2" x1="116.1" y1="262.2" x2="153.7" y2="275.9" marker-end="url(#pil-bla)"/>
<line class="pil-h2" x1="336.3" y1="241.7" x2="374.9" y2="252.0" marker-end="url(#pil-bla)"/>
<line class="pil-co2" x1="188.0" y1="173.3" x2="194.6" y2="167.7" marker-end="url(#pil-oransje)"/>
<line class="pil-co2" x1="260.9" y1="235.2" x2="253.5" y2="239.5" marker-end="url(#pil-oransje)"/>
<line class="pil-co2" x1="105.2" y1="169.1" x2="109.5" y2="176.5" marker-end="url(#pil-oransje)"/>
<line class="pil-co2" x1="328.7" y1="94.1" x2="335.8" y2="89.3" marker-end="url(#pil-oransje)"/>
<line class="pil-co2" x1="214.8" y1="265.9" x2="210.5" y2="258.5" marker-end="url(#pil-oransje)"/>
<line class="pil-co2" x1="225.1" y1="91.4" x2="217.1" y2="88.5" marker-end="url(#pil-oransje)"/>
<circle class="h2" cx="90" cy="330" r="5"/>
<text class="etikett" x="102" y="334">H₂ (lett, rask)</text>
<circle class="co2" cx="220" cy="330" r="9"/>
<text class="etikett" x="238" y="334">CO₂ (tung, treg)</text>
<line x1="420" y1="180" x2="470" y2="180" stroke="#898781" stroke-width="1.5" marker-end="url(#pil-gra)"/>
<text class="tittel" x="580" y="34" text-anchor="middle">Partialtrykk (1 mol hver)</text>
<rect x="540" y="70" width="90" height="220" fill="none" stroke="#0B0B0B" stroke-opacity="0.1" stroke-width="0.5"/>
<rect x="540" y="180" width="90" height="110" fill="#F0997B"/>
<rect x="540" y="70" width="90" height="110" fill="#85B7EB"/>
<text class="etikett" x="585" y="130" text-anchor="middle">P(H₂)</text>
<text class="etikett" x="585" y="240" text-anchor="middle">P(CO₂)</text>
<path class="tynn" d="M640 70H650V290H640"/>
<text class="etikett" x="660" y="180" text-anchor="middle" transform="rotate(90 660 180)">totaltrykk</text>
<text class="etikett" x="585" y="314" text-anchor="middle">Like store, selv om</text>
<text class="etikett" x="585" y="329" text-anchor="middle">CO₂ er 22 ganger tyngre</text>
</svg>
