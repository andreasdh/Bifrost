  <text x="672" y="48" font-size="22" fill="#8e44ad" font-style="italic" text-anchor="end">&#8450;</text>
  <text x="40" y="48" font-size="12.5" fill="#8e44ad" font-family="'SF Mono', monospace">komplekse tall</text>
  <g font-size="18" fill="#1c2321">
