  <text x="40" y="136" font-size="12.5" fill="#a8690b" font-family="'SF Mono', monospace">rasjonale tall</text>
  <g font-size="18" fill="#1c2321">
    <text x="164" y="137">1/2</text>
    <text x="224" y="137">&#8722;3/4</text>
    <text x="292" y="137">0,75</text>
  </g>
  <text x="368" y="136" font-size="11" fill="#a8690b" font-family="'SF Mono', monospace">nytt: br&#248;ker</text>

  <!-- ℤ band -->
  <text x="540" y="180" font-size="22" fill="#1a7a4c" font-style="italic" text-anchor="end">&#8484;</text>
  <text x="40" y="180" font-size="12.5" fill="#1a7a4c" font-family="'SF Mono', monospace">hele tall</text>
  <g font-size="18" fill="#1c2321">
    <text x="140" y="181">&#8722;1</text>
    <text x="188" y="181">&#8722;5</text>
    <text x="236" y="181">&#8722;42</text>
  </g>
  <text x="316" y="180" font-size="11" fill="#1a7a4c" font-family="'SF Mono', monospace">nytt: negative tall</text>

  <!-- ℤ⁺ band -->
  <text x="496" y="224" font-size="22" fill="#16867e" font-style="italic" text-anchor="end">&#8484;<tspan font-size="14" dy="-7">+</tspan></text>
  <text x="40" y="224" font-size="12.5" fill="#16867e" font-family="'SF Mono', monospace">ikke-negative heltall</text>
