    <text x="224" y="49">2 + 3i</text>
    <text x="312" y="49">&#8722;i</text>
    <text x="360" y="49">&#8730;&#8722;1</text>
  </g>
  <text x="448" y="48" font-size="11" fill="#8e44ad" font-family="'SF Mono', monospace">nytt: imagin&#230;re tall</text>

  <!-- ℝ band -->
