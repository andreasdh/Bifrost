  <text x="40" y="92" font-size="12.5" fill="#c0392b" font-family="'SF Mono', monospace">reelle tall</text>
  <g font-size="18" fill="#1c2321">
    <text x="152" y="93">&#8730;2</text>
    <text x="208" y="93">&#960;</text>
    <text x="252" y="93">e</text>
    <text x="296" y="93">&#8722;&#8730;5</text>
  </g>
  <text x="384" y="92" font-size="11" fill="#c0392b" font-family="'SF Mono', monospace">nytt: irrasjonale tall</text>

