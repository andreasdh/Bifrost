  <text x="452" y="268" font-size="22" fill="#1f5f8b" font-style="italic" text-anchor="end">&#8469;</text>
  <text x="40" y="268" font-size="12.5" fill="#1f5f8b" font-family="'SF Mono', monospace">naturlige tall</text>

  <!-- ℕ contents, scattered across the innermost area -->
  <g font-size="20" fill="#1c2321" text-anchor="middle">
    <text x="229" y="395">1</text>
    <text x="404" y="379">2</text>
    <text x="130" y="387">3</text>
    <text x="319" y="309">4</text>
    <text x="425" y="462">7</text>
    <text x="120" y="304">12</text>
    <text x="99" y="466">17</text>
    <text x="336" y="458">42</text>
    <text x="227" y="312">100</text>
    <text x="180" y="468">365</text>
    <text x="430" y="304">1000</text>
