<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="Georgia, 'Iowan Old Style', serif">
  <rect x="0" y="0" width="720" height="520" fill="#f5f2ea"/>

  <!-- ℂ outermost -->
  <rect x="22" y="22" width="676" height="476" rx="13"
        fill="#8e44ad" fill-opacity="0.09" stroke="#8e44ad" stroke-width="2"/>
  <!-- ℝ -->
  <rect x="22" y="66" width="632" height="432" rx="12"
        fill="#c0392b" fill-opacity="0.08" stroke="#c0392b" stroke-width="2"/>
  <!-- ℚ -->
  <rect x="22" y="110" width="588" height="388" rx="11"
        fill="#d68910" fill-opacity="0.10" stroke="#d68910" stroke-width="2"/>
  <!-- ℤ -->
  <rect x="22" y="154" width="544" height="344" rx="10"
        fill="#1a7a4c" fill-opacity="0.10" stroke="#1a7a4c" stroke-width="2"/>
  <!-- ℤ⁺ -->
  <rect x="22" y="198" width="500" height="300" rx="10"
        fill="#16867e" fill-opacity="0.12" stroke="#16867e" stroke-width="2"/>
  <!-- ℕ innermost -->
