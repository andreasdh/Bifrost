  .notevarm { fill: #c0392b; font-size: 13px; text-anchor: middle; }
  .notebla { fill: #1d6f8b; font-size: 13px; text-anchor: start; }
  @media (prefers-color-scheme: dark) {
    .glass, .bond { stroke: #e4e7eb; }
    .atom { fill: #e4e7eb; }
    .kork { fill: #9aa5b1; }
    .isolasjon { stroke: #7b8794; }
    .lbl { fill: #f5f7fa; }
    .sub, .var, .note { fill: #b3bcc6; }
    .varme { stroke: #e8705f; }
    .notevarm { fill: #e8705f; }
    .stroem { stroke: #63b3cf; }
    .notebla { fill: #63b3cf; }
  }
</style>
