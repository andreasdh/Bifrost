<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg"
     style="font-family: sans-serif; background: transparent;">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .th { font-size: 14px; font-weight: 500; fill: #1a1a1a; }
    .ts { font-size: 12px; font-weight: 400; fill: #555; }
    .cgray  rect { fill: #f1efe8; stroke: #5f5e5a; }
    .cgray  text { fill: #2c2c2a; }
    .cteal  rect { fill: #e1f5ee; stroke: #0f6e56; }
    .cteal  text { fill: #085041; }
    .camber rect { fill: #faeeda; stroke: #854f0b; }
    .camber text { fill: #412402; }
    .divider { stroke: #ccc; }
    .arr { stroke: #888; fill: none; marker-end: url(#arrow); }
  </style>
</defs>

<!-- Overskrifter -->
<text class="th" x="100" y="24" text-anchor="middle">Makrotilstand</text>
<text class="th" x="430" y="24" text-anchor="middle">Mikrotilstander  (● = kron, ○ = mynt)</text>

<!-- 0 kron -->
<g class="cgray">
  <rect x="16" y="40" width="178" height="40" rx="7" stroke-width="0.5"/>
  <text class="th" x="105" y="56" text-anchor="middle" dominant-baseline="central">0 kron</text>
  <text class="ts" x="105" y="72" text-anchor="middle" dominant-baseline="central">Ω = 1</text>
</g>
