<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <!-- background -->
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- ===== styles via defs ===== -->
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f6f6f"/>
    </marker>
  </defs>

  <!-- ===== top row: 3 cols at x=20,420,820 ; bottom row: 2 cols centered at x=210,610 ===== -->

  <!-- CELL 1: Algebraisk (was cell 2) -->
  <g>
    <rect x="20" y="20" width="360" height="360" rx="10" fill="#f7faf9" stroke="#d5e2e0" stroke-width="1.5"/>
    <rect x="20" y="20" width="360" height="46" rx="10" fill="#2f6f6f"/>
    <rect x="20" y="46" width="360" height="20" fill="#2f6f6f"/>
    <text x="200" y="50" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="600">1. Algebraisk (formel)</text>

    <text x="200" y="205" text-anchor="middle" fill="#1b3a3a" font-size="46" font-weight="700">H = 2n + 2</text>
    <text x="200" y="285" text-anchor="middle" fill="#5f7a78" font-size="15">n = antall karbonatomer</text>
    <text x="200" y="312" text-anchor="middle" fill="#5f7a78" font-size="15">H = antall hydrogenatomer</text>
  </g>

  <!-- CELL 2: Ordnede par (was cell 1) -->
  <g>
    <rect x="420" y="20" width="360" height="360" rx="10" fill="#f7faf9" stroke="#d5e2e0" stroke-width="1.5"/>
    <rect x="420" y="20" width="360" height="46" rx="10" fill="#2f6f6f"/>
    <rect x="420" y="46" width="360" height="20" fill="#2f6f6f"/>
    <text x="600" y="50" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="600">2. Mengde av ordnede par</text>

    <text x="600" y="180" text-anchor="middle" fill="#1b3a3a" font-size="24" font-weight="600">{(1, 4), (2, 6),</text>
    <text x="600" y="220" text-anchor="middle" fill="#1b3a3a" font-size="24" font-weight="600">(3, 8), (4, 10),</text>
    <text x="600" y="260" text-anchor="middle" fill="#1b3a3a" font-size="24" font-weight="600">(5, 12)}</text>
    <text x="600" y="330" text-anchor="middle" fill="#5f7a78" font-size="15">Hvert par er (n, H)</text>
  </g>

  <!-- CELL 3: Tabell -->
  <g>
    <rect x="820" y="20" width="360" height="360" rx="10" fill="#f7faf9" stroke="#d5e2e0" stroke-width="1.5"/>
    <rect x="820" y="20" width="360" height="46" rx="10" fill="#2f6f6f"/>
    <rect x="820" y="46" width="360" height="20" fill="#2f6f6f"/>
    <text x="1000" y="50" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="600">3. Tabell</text>

    <!-- table -->
    <g font-size="20" fill="#1b3a3a">
      <rect x="880" y="95" width="120" height="40" fill="#e3edeb"/>
      <rect x="1000" y="95" width="120" height="40" fill="#e3edeb"/>
      <text x="940" y="122" text-anchor="middle" font-weight="700">n</text>
      <text x="1060" y="122" text-anchor="middle" font-weight="700">H</text>
      <text x="940" y="167" text-anchor="middle">1</text><text x="1060" y="167" text-anchor="middle">4</text>
      <text x="940" y="207" text-anchor="middle">2</text><text x="1060" y="207" text-anchor="middle">6</text>
      <text x="940" y="247" text-anchor="middle">3</text><text x="1060" y="247" text-anchor="middle">8</text>
      <text x="940" y="287" text-anchor="middle">4</text><text x="1060" y="287" text-anchor="middle">10</text>
      <text x="940" y="327" text-anchor="middle">5</text><text x="1060" y="327" text-anchor="middle">12</text>
    </g>
    <g stroke="#c3d4d1" stroke-width="1">
      <line x1="880" y1="95" x2="880" y2="345"/>
      <line x1="1000" y1="95" x2="1000" y2="345"/>
      <line x1="1120" y1="95" x2="1120" y2="345"/>
      <line x1="880" y1="95" x2="1120" y2="95"/>
      <line x1="880" y1="135" x2="1120" y2="135"/>
      <line x1="880" y1="175" x2="1120" y2="175"/>
      <line x1="880" y1="215" x2="1120" y2="215"/>
      <line x1="880" y1="255" x2="1120" y2="255"/>
      <line x1="880" y1="295" x2="1120" y2="295"/>
      <line x1="880" y1="345" x2="1120" y2="345"/>
    </g>
  </g>

  <!-- CELL 4: Graf (bottom row) — group shifted +20 for true centering (rect 210->230) -->
  <g transform="translate(20,0)">
    <rect x="210" y="400" width="360" height="360" rx="10" fill="#f7faf9" stroke="#d5e2e0" stroke-width="1.5"/>
    <rect x="210" y="400" width="360" height="46" rx="10" fill="#2f6f6f"/>
    <rect x="210" y="426" width="360" height="20" fill="#2f6f6f"/>
    <text x="390" y="430" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="600">4. Graf</text>

    <!-- axes: origin at (260,720), x tick spacing 48, y H*18 -->
    <line x1="260" y1="720" x2="550" y2="720" stroke="#1b3a3a" stroke-width="2"/>
    <line x1="260" y1="720" x2="260" y2="470" stroke="#1b3a3a" stroke-width="2"/>
    <text x="550" y="742" text-anchor="middle" fill="#1b3a3a" font-size="16" font-weight="600">n</text>
    <text x="242" y="478" text-anchor="middle" fill="#1b3a3a" font-size="16" font-weight="600">H</text>

    <!-- x ticks: n=1..5 at x = 260 + n*48 -->
    <g fill="#5f7a78" font-size="13" text-anchor="middle">
      <text x="308" y="740">1</text>
      <text x="356" y="740">2</text>
      <text x="404" y="740">3</text>
      <text x="452" y="740">4</text>
      <text x="500" y="740">5</text>
    </g>
    <!-- y ticks -->
    <g fill="#5f7a78" font-size="13" text-anchor="end">
      <text x="252" y="653">4</text>
      <text x="252" y="617">6</text>
      <text x="252" y="581">8</text>
      <text x="252" y="545">10</text>
      <text x="252" y="509">12</text>
    </g>
    <g stroke="#e0eae8" stroke-width="1">
      <line x1="260" y1="648" x2="550" y2="648"/>
      <line x1="260" y1="612" x2="550" y2="612"/>
      <line x1="260" y1="576" x2="550" y2="576"/>
      <line x1="260" y1="540" x2="550" y2="540"/>
      <line x1="260" y1="504" x2="550" y2="504"/>
    </g>
    <!-- points: (260+n*48, 720-H*18) -->
    <g fill="#d1603a">
      <circle cx="308" cy="648" r="6"/>
      <circle cx="356" cy="612" r="6"/>
      <circle cx="404" cy="576" r="6"/>
      <circle cx="452" cy="540" r="6"/>
      <circle cx="500" cy="504" r="6"/>
    </g>
  </g>

  <!-- CELL 5: Pil-diagram (bottom row, centered right at x=610) -->
  <g>
    <rect x="610" y="400" width="360" height="360" rx="10" fill="#f7faf9" stroke="#d5e2e0" stroke-width="1.5"/>
    <rect x="610" y="400" width="360" height="46" rx="10" fill="#2f6f6f"/>
    <rect x="610" y="426" width="360" height="20" fill="#2f6f6f"/>
    <text x="790" y="430" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="600">5. Diagram (piler)</text>

    <!-- labels: left = definisjonsmengde (n), right = verdiområde N (H) -->
    <text x="678" y="470" text-anchor="middle" fill="#5f7a78" font-size="16" font-weight="700">n</text>
    <text x="882" y="470" text-anchor="middle" fill="#5f7a78" font-size="16" font-weight="700">H &#8712; &#8469;</text>

    <!-- left oval (definisjonsmengde) -->
    <ellipse cx="678" cy="615" rx="52" ry="125" fill="none" stroke="#9db9b6" stroke-width="1.5"/>
    <!-- right oval (kodomen N) — bigger to signal it holds many values -->
    <ellipse cx="882" cy="613" rx="72" ry="140" fill="none" stroke="#9db9b6" stroke-width="1.5"/>

    <!-- domain values n=1..5 -->
    <g font-size="19" fill="#1b3a3a" text-anchor="middle">
      <text x="678" y="532">1</text>
      <text x="678" y="577">2</text>
      <text x="678" y="622">3</text>
      <text x="678" y="667">4</text>
      <text x="678" y="712">5</text>
    </g>

    <!-- codomain: faint "unhit" values scattered around, showing N is large -->
    <g font-size="15" fill="#b7c5c3" text-anchor="middle">
      <text x="852" y="507">1</text>
      <text x="914" y="512">3</text>
      <text x="850" y="600">5</text>
      <text x="916" y="600">7</text>
      <text x="850" y="697">9</text>
      <text x="916" y="695">11</text>
      <text x="882" y="742">13</text>
      <text x="914" y="655">&#8230;</text>
    </g>

    <!-- codomain: the actually-hit values (verdimengde) — dark and bold -->
    <g font-size="19" fill="#1b3a3a" text-anchor="middle" font-weight="600">
      <text x="882" y="535">4</text>
      <text x="882" y="573">6</text>
      <text x="882" y="622">8</text>
      <text x="882" y="668">10</text>
      <text x="882" y="712">12</text>
    </g>

    <!-- arrows land on the hit values -->
    <g stroke="#2f6f6f" stroke-width="1.8" marker-end="url(#arrow)">
      <line x1="720" y1="526" x2="852" y2="529"/>
      <line x1="720" y1="571" x2="852" y2="567"/>
      <line x1="720" y1="616" x2="855" y2="616"/>
      <line x1="720" y1="661" x2="850" y2="662"/>
      <line x1="720" y1="706" x2="850" y2="706"/>
    </g>
  </g>
</svg>
