<svg width="100%" viewBox="0 0 680 400" role="img" style="" xmlns="http://www.w3.org/2000/svg"><title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Kraftretning mellom to molekyler ved tre avstander, og en energiskala som sammenligner van der Waals-binding med kovalent binding</title><desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Øverst: tre par molekyler. Når de er nærmere enn likevekt dyttes de fra hverandre (frastøtning), ved likevekt er nettokraften null, og lenger unna trekkes de sammen (tiltrekning). Nederst: en logaritmisk energiskala der van der Waals-binding ligger rundt 150 K og kovalent binding rundt tusenvis av kelvin.</desc>
