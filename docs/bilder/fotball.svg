<svg width="100%" viewBox="0 0 680 540" role="img" style="" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Fotball-analogi for u(r) og Lennard-Jones-potensialet</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">En generisk fotballspiller i tre faser som analogi til fast stoff, væske og gass. Fast stoff: ballen holdes tett inntil foten, tilsvarende partikler som vibrerer nær likevektsavstanden r-stjerne, nær bunnen av potensialbrønnen. Væske: ballen er i dribleavstand, tilsvarende noe mer bevegelsesfrihet rundt likevekten. Gass: ballen er langt unna og beveger seg fritt, tilsvarende at u(r) er tilnærmet null. Under illustrasjonen viser en graf potensiell energi u(r) som funksjon av avstanden r, med et minimum ved likevektsavstanden r-stjerne som stiplede linjer kobler direkte til hver av de tre fasene ovenfor.</desc>
