<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="780" height="480" fill="white"/>

  <!-- Plot area: axes -->
  <!-- y-axis at x=90, x-axis at y=400 -->
  <line x1="90" y1="60" x2="90" y2="400" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="400" x2="720" y2="400" stroke="#333" stroke-width="2"/>
  <polygon points="90,54 85,66 95,66" fill="#333"/>
  <polygon points="726,400 714,395 714,405" fill="#333"/>
  <text x="102" y="72" font-size="16" fill="#333" font-style="italic">y</text>
  <text x="714" y="392" font-size="16" fill="#333" font-style="italic">x</text>

  <!-- Curve f: a rising parabola-like curve -->
  <!-- A at x=250 (a), B at x=560 (b) -->
  <!-- Curve chosen so A=(250,320) and B=(560,150) sit on it -->
  <path d="M 120 380 Q 300 360 400 270 Q 500 180 660 110" stroke="#1565c0" stroke-width="3" fill="none"/>
  <text x="150" y="392" font-size="16" fill="#1565c0" font-style="italic">f</text>

  <!-- Points A and B on the curve -->
  <!-- A = (250, 320) ; B = (560, 150) -->
  <!-- Secant line through A and B -->
  <line x1="195" y1="387.8" x2="615" y2="124.6" stroke="#d32f2f" stroke-width="2.5"/>

  <!-- (Δ-hjelpelinjer fjernet; oransje f(a)-linje forlenges i stedet) -->

  <!-- dashed drop lines to x-axis for a and b (green) -->
  <line x1="250" y1="353.3" x2="250" y2="400" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="560" y1="159.1" x2="560" y2="400" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- dashed lines to y-axis for f(a) and f(b) (orange); f(a) extended to x=560 to meet b's green line perpendicularly -->
  <line x1="560" y1="353.3" x2="90" y2="353.3" stroke="#ef6c00" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="560" y1="159.1" x2="90" y2="159.1" stroke="#ef6c00" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Points -->
  <circle cx="250" cy="353.3" r="5.5" fill="#1565c0"/>
  <circle cx="560" cy="159.1" r="5.5" fill="#1565c0"/>

  <!-- (A- og B-etiketter fjernet) -->

  <!-- x-axis labels a and b -->
  <text x="250" y="420" font-size="15" fill="#333" text-anchor="middle" font-style="italic">a</text>
  <text x="560" y="420" font-size="15" fill="#333" text-anchor="middle" font-style="italic">b</text>

  <!-- y-axis labels f(a) and f(b) -->
  <text x="82" y="358" font-size="14" fill="#333" text-anchor="end"><tspan font-style="italic">f</tspan>(<tspan font-style="italic">a</tspan>)</text>
  <text x="82" y="164" font-size="14" fill="#333" text-anchor="end"><tspan font-style="italic">f</tspan>(<tspan font-style="italic">b</tspan>)</text>

  <!-- Delta labels -->
  <text x="405" y="347" font-size="15" fill="#555" text-anchor="middle">&#916;x = b &#8722; a</text>
  <text x="570" y="260" font-size="15" fill="#555">&#916;y = f(b) &#8722; f(a)</text>

  <!-- Formula for average rate of change -->
  <g fill="#d32f2f">
    <text x="120" y="120" font-size="16">Gjennomsnittlig endringsrate =</text>
    <text x="415" y="112" font-size="15" text-anchor="middle"><tspan font-style="italic">f</tspan>(<tspan font-style="italic">b</tspan>) &#8722; <tspan font-style="italic">f</tspan>(<tspan font-style="italic">a</tspan>)</text>
    <line x1="360" y1="118" x2="470" y2="118" stroke="#d32f2f" stroke-width="1.5"/>
    <text x="415" y="135" font-size="15" text-anchor="middle"><tspan font-style="italic">b</tspan> &#8722; <tspan font-style="italic">a</tspan></text>
  </g>
</svg>
