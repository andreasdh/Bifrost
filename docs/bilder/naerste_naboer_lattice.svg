<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Nærmeste naboer i en lattice-modell</title>
<desc>En sentral partikkel har fire nærmeste naboer: over, under, til venstre og til høyre. Diagonale posisjoner regnes ikke som nærmeste naboer.</desc>

<rect x="0" y="0" width="680" height="460" fill="#ffffff"/>

<line x1="340" y1="240" x2="340" y2="140" stroke="#D85A30" stroke-width="2.5"/>
<line x1="340" y1="240" x2="340" y2="340" stroke="#D85A30" stroke-width="2.5"/>
<line x1="340" y1="240" x2="240" y2="240" stroke="#D85A30" stroke-width="2.5"/>
<line x1="340" y1="240" x2="440" y2="240" stroke="#D85A30" stroke-width="2.5"/>

<circle cx="240" cy="140" r="30" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<circle cx="440" cy="140" r="30" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<circle cx="240" cy="340" r="30" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<circle cx="440" cy="340" r="30" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>

<circle cx="340" cy="140" r="30" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="140" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0C447C">B</text>

<circle cx="340" cy="340" r="30" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="340" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0C447C">B</text>

<circle cx="240" cy="240" r="30" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="240" y="240" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0C447C">B</text>

<circle cx="440" cy="240" r="30" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="440" y="240" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0C447C">B</text>

<circle cx="340" cy="240" r="30" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="340" y="240" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#791F1F">A</text>

<circle cx="270" cy="420" r="7" fill="#E24B4A"/>
<text x="284" y="424" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3d3d3a">sentral partikkel</text>

<circle cx="440" cy="420" r="7" fill="#378ADD"/>
<text x="454" y="424" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3d3d3a">nærmeste nabo (4 totalt)</text>

</svg>
