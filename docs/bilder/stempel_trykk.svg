<svg viewBox="0 0 820 440" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M1,1 L7,4 L1,7 Z" fill="#444"/>
    </marker>
    <symbol id="spark" viewBox="-6 -6 12 12">
      <path d="M0,-6 L1.6,-1.6 L6,0 L1.6,1.6 L0,6 L-1.6,1.6 L-6,0 L-1.6,-1.6 Z" fill="#e8622a"/>
    </symbol>
  </defs>

  <rect width="820" height="440" fill="#ffffff"/>
  <text x="410" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Samme gass og samme temperatur &#8212; stempelet presses inn</text>

  <!-- =============== PANEL 1: stort volum =============== -->
  <g transform="translate(20,0)">
    <!-- gas fill -->
    <rect x="70" y="166" width="160" height="194" fill="#eef4fb"/>
    <!-- cylinder walls -->
    <rect x="60" y="95" width="10" height="275" fill="#6b6b6b"/>
    <rect x="230" y="95" width="10" height="275" fill="#6b6b6b"/>
    <rect x="60" y="360" width="180" height="10" fill="#6b6b6b"/>
    <!-- piston -->
    <rect x="144" y="70" width="12" height="82" fill="#555"/>
    <rect x="115" y="60" width="70" height="12" rx="3" fill="#555"/>
    <rect x="70" y="150" width="160" height="16" fill="#9a9a9a" stroke="#555" stroke-width="1.5"/>

    <!-- collision sparks -->
    <use href="#spark" x="64" y="214" width="12" height="12"/>
    <use href="#spark" x="224" y="196" width="12" height="12"/>
    <use href="#spark" x="224" y="300" width="12" height="12"/>
    <use href="#spark" x="150" y="354" width="12" height="12"/>

    <!-- molecules with motion streaks (same speed) -->
    <g stroke="#c2cede" stroke-width="2">
      <line x1="95" y1="200" x2="109" y2="192"/>
      <line x1="145" y1="188" x2="131" y2="196"/>
      <line x1="195" y1="215" x2="181" y2="209"/>
      <line x1="110" y1="255" x2="124" y2="249"/>
      <line x1="170" y1="258" x2="156" y2="264"/>
      <line x1="212" y1="242" x2="198" y2="248"/>
      <line x1="92" y1="305" x2="106" y2="311"/>
      <line x1="152" y1="312" x2="166" y2="306"/>
      <line x1="205" y1="322" x2="191" y2="316"/>
      <line x1="128" y1="342" x2="142" y2="348"/>
    </g>
    <g fill="#3b6fb0">
      <circle cx="95" cy="200" r="7"/><circle cx="145" cy="188" r="7"/>
      <circle cx="195" cy="215" r="7"/><circle cx="110" cy="255" r="7"/>
      <circle cx="170" cy="258" r="7"/><circle cx="212" cy="242" r="7"/>
      <circle cx="92" cy="305" r="7"/><circle cx="152" cy="312" r="7"/>
      <circle cx="205" cy="322" r="7"/><circle cx="128" cy="342" r="7"/>
    </g>

    <!-- volume bracket -->
    <line x1="252" y1="166" x2="252" y2="360" stroke="#444" stroke-width="1.4" marker-start="url(#arw)" marker-end="url(#arw)"/>
    <text x="264" y="268" font-size="15" fill="#444" font-style="italic">V</text>

    <!-- labels -->
    <text x="150" y="396" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Stort volum V</text>
    <text x="150" y="416" text-anchor="middle" font-size="14" fill="#666">lavt trykk P</text>
  </g>

  <!-- =============== PANEL 2: lite volum =============== -->
  <g transform="translate(440,0)">
    <!-- push arrow -->
    <line x1="150" y1="32" x2="150" y2="56" stroke="#c0392b" stroke-width="4" marker-end="url(#arw)"/>
    <text x="165" y="48" font-size="13" fill="#c0392b" font-weight="bold">press inn</text>

    <!-- gas fill (half) -->
    <rect x="70" y="264" width="160" height="96" fill="#eef4fb"/>
    <!-- cylinder walls -->
    <rect x="60" y="95" width="10" height="275" fill="#6b6b6b"/>
    <rect x="230" y="95" width="10" height="275" fill="#6b6b6b"/>
    <rect x="60" y="360" width="180" height="10" fill="#6b6b6b"/>
    <!-- piston (pushed down) -->
    <rect x="144" y="70" width="12" height="180" fill="#555"/>
    <rect x="115" y="60" width="70" height="12" rx="3" fill="#555"/>
    <rect x="70" y="248" width="160" height="16" fill="#9a9a9a" stroke="#555" stroke-width="1.5"/>

    <!-- more collision sparks -->
    <use href="#spark" x="64" y="284" width="12" height="12"/>
    <use href="#spark" x="64" y="330" width="12" height="12"/>
    <use href="#spark" x="224" y="280" width="12" height="12"/>
    <use href="#spark" x="224" y="332" width="12" height="12"/>
    <use href="#spark" x="106" y="354" width="12" height="12"/>
    <use href="#spark" x="156" y="354" width="12" height="12"/>
    <use href="#spark" x="200" y="354" width="12" height="12"/>
    <use href="#spark" x="224" y="306" width="12" height="12"/>

    <!-- molecules (same 10, crowded) with streaks -->
    <g stroke="#c2cede" stroke-width="2">
      <line x1="90" y1="285" x2="104" y2="279"/>
      <line x1="122" y1="280" x2="108" y2="286"/>
      <line x1="156" y1="285" x2="170" y2="279"/>
      <line x1="192" y1="282" x2="178" y2="288"/>
      <line x1="215" y1="292" x2="201" y2="286"/>
      <line x1="100" y1="318" x2="114" y2="324"/>
      <line x1="136" y1="322" x2="150" y2="316"/>
      <line x1="172" y1="320" x2="158" y2="326"/>
      <line x1="206" y1="322" x2="192" y2="316"/>
      <line x1="150" y1="345" x2="164" y2="339"/>
    </g>
    <g fill="#3b6fb0">
      <circle cx="90" cy="285" r="7"/><circle cx="122" cy="280" r="7"/>
      <circle cx="156" cy="285" r="7"/><circle cx="192" cy="282" r="7"/>
      <circle cx="215" cy="292" r="7"/><circle cx="100" cy="318" r="7"/>
      <circle cx="136" cy="322" r="7"/><circle cx="172" cy="320" r="7"/>
      <circle cx="206" cy="322" r="7"/><circle cx="150" cy="345" r="7"/>
    </g>

    <!-- volume bracket (half) -->
    <line x1="252" y1="264" x2="252" y2="360" stroke="#444" stroke-width="1.4" marker-start="url(#arw)" marker-end="url(#arw)"/>
    <text x="262" y="318" font-size="15" fill="#444" font-style="italic">V/2</text>

    <!-- labels -->
    <text x="150" y="396" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Lite volum V/2</text>
    <text x="150" y="416" text-anchor="middle" font-size="14" fill="#c0392b">h&#248;yt trykk 2P</text>
  </g>

  <!-- shared bottom caption -->
  <text x="410" y="436" text-anchor="middle" font-size="12.5" fill="#333">Samme antall molekyler, samme fart (samme T). I mindre volum treffer de veggene oftere &#8594; h&#248;yere trykk  (P &#8733; 1/V ved konstant T).</text>
</svg>
