<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="820" height="260" fill="#ffffff"/>

  <!-- ===================== Diagram 1: Komplement ===================== -->
  <g transform="translate(20,10)">
    <rect x="15" y="15" width="210" height="170" rx="8" fill="none" stroke="#888880" stroke-width="1"/>
    <path d="M15,15 H225 V185 H15 Z M145,100 A55,55 0 1,0 35,100 A55,55 0 1,0 145,100 Z"
          fill="#B5D4F4" fill-rule="evenodd"/>
    <circle cx="90" cy="100" r="55" fill="none" stroke="#444441" stroke-width="1.2"/>
    <text x="24" y="32" font-size="13" fill="#5F5E5A">S</text>
    <text x="90" y="105" font-size="15" font-weight="600" text-anchor="middle" fill="#2C2C2A">A</text>
    <text x="120" y="230" font-size="13" text-anchor="middle" fill="#5F5E5A">Def. 1.4 — Komplement A′</text>
  </g>

  <!-- ===================== Diagram 2: Snitt ===================== -->
  <g transform="translate(300,10)">
    <defs>
      <clipPath id="clipB2">
        <circle cx="150" cy="100" r="55"/>
      </clipPath>
    </defs>
    <rect x="15" y="15" width="210" height="170" rx="8" fill="none" stroke="#888880" stroke-width="1"/>
    <circle cx="90" cy="100" r="55" fill="#B5D4F4" clip-path="url(#clipB2)"/>
    <circle cx="90" cy="100" r="55" fill="none" stroke="#444441" stroke-width="1.2"/>
    <circle cx="150" cy="100" r="55" fill="none" stroke="#444441" stroke-width="1.2"/>
    <text x="24" y="32" font-size="13" fill="#5F5E5A">S</text>
    <text x="62" y="105" font-size="15" font-weight="600" text-anchor="middle" fill="#2C2C2A">A</text>
    <text x="178" y="105" font-size="15" font-weight="600" text-anchor="middle" fill="#2C2C2A">B</text>
    <text x="120" y="230" font-size="13" text-anchor="middle" fill="#5F5E5A">Def. 1.5 — Snitt A ∩ B</text>
  </g>

  <!-- ===================== Diagram 3: Union ===================== -->
  <g transform="translate(580,10)">
    <rect x="15" y="15" width="210" height="170" rx="8" fill="none" stroke="#888880" stroke-width="1"/>
    <circle cx="90" cy="100" r="55" fill="#B5D4F4"/>
    <circle cx="150" cy="100" r="55" fill="#B5D4F4"/>
    <circle cx="90" cy="100" r="55" fill="none" stroke="#444441" stroke-width="1.2"/>
    <circle cx="150" cy="100" r="55" fill="none" stroke="#444441" stroke-width="1.2"/>
    <text x="24" y="32" font-size="13" fill="#5F5E5A">S</text>
    <text x="62" y="105" font-size="15" font-weight="600" text-anchor="middle" fill="#2C2C2A">A</text>
    <text x="178" y="105" font-size="15" font-weight="600" text-anchor="middle" fill="#2C2C2A">B</text>
    <text x="120" y="230" font-size="13" text-anchor="middle" fill="#5F5E5A">Def. 1.6 — Union A ∪ B</text>
  </g>
</svg>
