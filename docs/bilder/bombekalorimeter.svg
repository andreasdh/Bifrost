<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" role="img" aria-labelledby="bkTitle bkDesc">
<title id="bkTitle">Bombekalorimeter</title>
<desc id="bkDesc">En stiv beholder i et vannbad omgitt av adiabatiske vegger. Termometer med delta T markert langs den roede soeyla, samt et roereverk. Prosessen skjer ved konstant volum.</desc>

<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .t  { font-size: 16px; }
  .ts { font-size: 13px; }
  .th { font-size: 15px; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .ink    { fill: #F2F1EC; }
    .ink-s  { stroke: #F2F1EC; }
    .ink2   { fill: #B0AEA6; }
    .ink2-s { stroke: #B0AEA6; }
    .surf1  { fill: #262420; }
    .surf2  { fill: #322F29; }
  }
</style>

<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
    <path class="ink" d="M0 0.5 L10 5 L0 9.5 Z" fill="#1A1A18"/>
  </marker>
  <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
    <path class="ink2" d="M0 0.5 L10 5 L0 9.5 Z" fill="#57564F"/>
  </marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
    <path d="M0 0.5 L10 5 L0 9.5 Z" fill="#E24B4A"/>
  </marker>
</defs>

<!-- Beholder -->
<rect class="surf1 ink-s" x="200" y="110" width="290" height="300" rx="4" fill="#FAFAF7" stroke="#1A1A18" stroke-width="2.5"/>
<rect x="210" y="120" width="270" height="280" fill="#3E8E9C"/>
<rect x="232" y="142" width="226" height="236" fill="#B5D4F4"/>
<rect class="surf2 ink-s" x="188" y="86" width="314" height="24" rx="3" fill="#F0EFEA" stroke="#1A1A18" stroke-width="2"/>

<!-- System og varme -->
<rect class="ink-s" x="360" y="228" width="58" height="72" rx="3" fill="#B4B2A9" stroke="#1A1A18" stroke-width="1.5"/>
<line x1="389" y1="220" x2="389" y2="174" stroke="#E24B4A" stroke-width="4" marker-end="url(#arrR)"/>
<text class="ts" x="389" y="160" text-anchor="middle" fill="#0C447C">q<tspan baseline-shift="sub" font-size="10px">kal</tspan></text>
<text class="ts" x="430" y="342" text-anchor="middle" fill="#0C447C">vann</text>

<!-- Røreverk -->
<line class="ink-s" x1="305" y1="52" x2="305" y2="346" stroke="#1A1A18" stroke-width="4" stroke-linecap="round"/>
<ellipse class="surf1 ink-s" cx="305" cy="350" rx="22" ry="6" fill="#FAFAF7" stroke="#1A1A18" stroke-width="1.5"/>

<!-- Termometer -->
<rect class="surf2 ink-s" x="242" y="52" width="18" height="288" rx="8" fill="#F0EFEA" stroke="#1A1A18" stroke-width="1.5"/>
<rect x="246.5" y="168" width="9" height="172" fill="#E24B4A"/>
<ellipse cx="251" cy="346" rx="11" ry="15" fill="#E24B4A" stroke="#A32D2D" stroke-width="1"/>

<!-- Etiketter -->
<text class="ts ink2" x="510" y="152" fill="#57564F">Adiabatiske vegger</text>
<line class="ink2-s" x1="506" y1="158" x2="472" y2="182" stroke="#57564F" stroke-width="1" marker-end="url(#arrS)"/>
<text class="ts ink2" x="510" y="266" fill="#57564F">System</text>
<line class="ink2-s" x1="504" y1="262" x2="424" y2="262" stroke="#57564F" stroke-width="1" marker-end="url(#arrS)"/>
<text class="ts ink2" x="510" y="76" fill="#57564F">Røreverk</text>
<line class="ink2-s" x1="504" y1="72" x2="316" y2="60" stroke="#57564F" stroke-width="1" marker-end="url(#arrS)"/>

<!-- Delta T -->
<line class="ink-s" x1="140" y1="168" x2="140" y2="212" stroke="#1A1A18" stroke-width="1.5"/>
<line class="ink-s" x1="140" y1="168" x2="239" y2="168" stroke="#1A1A18" stroke-width="1.5" marker-end="url(#arr)"/>
<line class="ink-s" x1="140" y1="212" x2="239" y2="212" stroke="#1A1A18" stroke-width="1.5" marker-end="url(#arr)"/>
<text class="t ink" x="128" y="194" text-anchor="end" fill="#1A1A18">ΔT</text>

<!-- Tittel -->
<text class="th ink" x="345" y="458" text-anchor="middle" fill="#1A1A18">Bombekalorimeter</text>
<text class="ts ink2" x="345" y="480" text-anchor="middle" fill="#57564F">Konstant volum. q<tspan baseline-shift="sub" font-size="10px">V</tspan> = ΔU</text>
</svg>
