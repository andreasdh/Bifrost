<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480" role="img" aria-labelledby="kkTitle kkDesc">
<title id="kkTitle">Kaffekoppkalorimeter</title>
<desc id="kkDesc">Isoporkopp med vann. Et termometer stikker ned i vaesken, og delta T er markert langs den roede soeyla. Systemet er loest i vannet. Prosessen skjer ved konstant trykk.</desc>

<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .t  { font-size: 16px; }
  .ts { font-size: 13px; }
  .th { font-size: 15px; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .ink    { fill: #F2F1EC; }
    .ink-s  { stroke: #F2F1EC; }
    .ink2   { fill: #B0AEA6; }
    .ink2-s { stroke: #B0AEA6; }
    .surf1  { fill: #262420; }
    .surf2  { fill: #322F29; }
  }
</style>

<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
    <path class="ink" d="M0 0.5 L10 5 L0 9.5 Z" fill="#1A1A18"/>
  </marker>
  <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
    <path class="ink2" d="M0 0.5 L10 5 L0 9.5 Z" fill="#57564F"/>
  </marker>
</defs>

<!-- Kopp -->
<path class="surf1 ink-s" d="M190 150 L222 400 L418 400 L450 150 Z" fill="#FAFAF7" stroke="#1A1A18" stroke-width="2.5" stroke-linejoin="round"/>
<path class="surf2 ink-s" d="M210 168 L238 382 L402 382 L430 168 Z" fill="#F0EFEA" stroke="#1A1A18" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M214.2 200 L238 382 L402 382 L425.8 200 Z" fill="#B5D4F4"/>

<!-- System -->
<circle class="ink" cx="340" cy="322" r="7" fill="#1A1A18"/>

<!-- Termometer -->
<rect class="surf2 ink-s" x="311" y="40" width="18" height="270" rx="8" fill="#F0EFEA" stroke="#1A1A18" stroke-width="1.5"/>
<rect x="315.5" y="88" width="9" height="222" fill="#E24B4A"/>
<ellipse cx="320" cy="316" rx="11" ry="15" fill="#E24B4A" stroke="#A32D2D" stroke-width="1"/>

<!-- Etiketter -->
<text class="ts ink2" x="500" y="178" fill="#57564F">Isoporkopp</text>
<line class="ink2-s" x1="494" y1="184" x2="448" y2="200" stroke="#57564F" stroke-width="1" marker-end="url(#arrS)"/>

<text class="ts ink2" x="500" y="292" fill="#57564F">Systemet er løst</text>
<text class="ts ink2" x="500" y="310" fill="#57564F">i vannet</text>
<line class="ink2-s" x1="494" y1="298" x2="352" y2="320" stroke="#57564F" stroke-width="1" marker-end="url(#arrS)"/>

<!-- Delta T -->
<line class="ink-s" x1="162" y1="88" x2="162" y2="132" stroke="#1A1A18" stroke-width="1.5"/>
<line class="ink-s" x1="162" y1="88" x2="308" y2="88" stroke="#1A1A18" stroke-width="1.5" marker-end="url(#arr)"/>
<line class="ink-s" x1="162" y1="132" x2="308" y2="132" stroke="#1A1A18" stroke-width="1.5" marker-end="url(#arr)"/>
<text class="t ink" x="150" y="114" text-anchor="end" fill="#1A1A18">ΔT</text>

<!-- Tittel -->
<text class="th ink" x="320" y="442" text-anchor="middle" fill="#1A1A18">Kaffekoppkalorimeter</text>
<text class="ts ink2" x="320" y="464" text-anchor="middle" fill="#57564F">Konstant trykk. q<tspan baseline-shift="sub" font-size="10px">P</tspan> = ΔH</text>
</svg>
