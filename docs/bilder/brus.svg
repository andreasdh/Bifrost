<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="tit besk">
  <title id="tit">Hvorfor har en gass trykk?</title>
  <desc id="besk">Tverrsnitt av en brusflaske. Gassmolekylene over væsken presser mot korken,
    glasset og væskeoverflaten i alle retninger. Et forstørret utsnitt av glassveggen viser at
    dette presset består av utallige enkeltstøt fra molekyler som spretter tilbake.</desc>

  <defs>
    <marker id="pOut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5 z" fill="#D1502E"/>
    </marker>
    <marker id="mBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5 z" fill="#26408B"/>
    </marker>
    <marker id="mWarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5 z" fill="#D1502E"/>
    </marker>

    <clipPath id="bottleClip">
      <path d="M130,62 L130,102 C130,124 86,134 86,172 L86,352 Q86,374 108,374 L192,374
               Q214,374 214,352 L214,172 C214,134 170,124 170,102 L170,62 Z"/>
    </clipPath>
    <clipPath id="lensClip"><circle cx="512" cy="206" r="132"/></clipPath>

    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EAF0F5"/>
      <stop offset=".45" stop-color="#F8FBFD"/>
      <stop offset="1" stop-color="#DCE5EC"/>
    </linearGradient>
  </defs>

  <text x="24" y="24" font-size="14" font-weight="700" fill="#16212B">Hvorfor har en gass trykk?</text>
  <text x="24" y="41" font-size="11.5" fill="#5C6B78">Trykket i en lukket brusflaske er summen av utallige molekylstøt mot veggene.</text>

  <!-- ===== BOTTLE ===== -->
  <!-- body glass -->
  <path d="M130,62 L130,102 C130,124 86,134 86,172 L86,352 Q86,374 108,374 L192,374
           Q214,374 214,352 L214,172 C214,134 170,124 170,102 L170,62 Z"
        fill="url(#glassGrad)" stroke="#8FA3B5" stroke-width="2"/>

  <!-- liquid -->
  <g clip-path="url(#bottleClip)">
    <rect x="80" y="252" width="142" height="130" fill="#D9A05B"/>
    <rect x="80" y="252" width="142" height="5" fill="#B5793A"/>
    <g fill="#F0D3A8" opacity=".85">
      <circle cx="110" cy="300" r="3.2"/><circle cx="150" cy="330" r="2.4"/>
      <circle cx="185" cy="292" r="2.8"/><circle cx="128" cy="352" r="2.2"/>
      <circle cx="168" cy="315" r="2"/><circle cx="196" cy="345" r="2.6"/>
      <circle cx="100" cy="336" r="2"/>
    </g>
  </g>
  <text x="150" y="322" font-size="11.5" font-weight="700" fill="#6B4416" text-anchor="middle">brus</text>

  <!-- cap -->
  <rect x="123" y="42" width="54" height="21" rx="3" fill="#7E8B97" stroke="#5C6B78" stroke-width="1.4"/>
  <g stroke="#5C6B78" stroke-width="1" opacity=".55">
    <line x1="131" y1="45" x2="131" y2="60"/><line x1="139" y1="45" x2="139" y2="60"/>
    <line x1="147" y1="45" x2="147" y2="60"/><line x1="155" y1="45" x2="155" y2="60"/>
    <line x1="163" y1="45" x2="163" y2="60"/><line x1="171" y1="45" x2="171" y2="60"/>
  </g>
  <text x="188" y="56" font-size="10.5" fill="#5C6B78">kork</text>

  <!-- gas label -->
  <text x="150" y="163" font-size="12" font-weight="700" fill="#26408B" text-anchor="middle">gass</text>

  <!-- gas molecules with short trails -->
  <g clip-path="url(#bottleClip)">
    <g stroke="#26408B" stroke-width="1.3" opacity=".38">
      <line x1="141" y1="86" x2="150" y2="79"/><line x1="132" y1="104" x2="141" y2="97"/>
      <line x1="97"  y1="196" x2="106" y2="188"/><line x1="149" y1="186" x2="140" y2="179"/>
      <line x1="184" y1="182" x2="176" y2="190"/><line x1="205" y1="188" x2="197" y2="181"/>
      <line x1="92"  y1="224" x2="101" y2="217"/><line x1="137" y1="216" x2="129" y2="209"/>
      <line x1="152" y1="230" x2="161" y2="223"/><line x1="200" y1="222" x2="191" y2="216"/>
      <line x1="107" y1="243" x2="116" y2="237"/><line x1="180" y1="245" x2="172" y2="239"/>
    </g>
    <g fill="#26408B">
      <circle cx="150" cy="78"  r="4.2"/><circle cx="141" cy="96"  r="4.2"/>
      <circle cx="106" cy="187" r="4.2"/><circle cx="139" cy="178" r="4.2"/>
      <circle cx="175" cy="191" r="4.2"/><circle cx="196" cy="180" r="4.2"/>
      <circle cx="101" cy="216" r="4.2"/><circle cx="128" cy="208" r="4.2"/>
      <circle cx="162" cy="222" r="4.2"/><circle cx="190" cy="215" r="4.2"/>
      <circle cx="117" cy="236" r="4.2"/><circle cx="171" cy="238" r="4.2"/>
      <circle cx="158" cy="112" r="4.2"/>
    </g>
  </g>

  <!-- outward pressure arrows: in all directions -->
  <g stroke="#D1502E" stroke-width="2" marker-end="url(#pOut)">
    <!-- up, against the cap -->
    <line x1="140" y1="80" x2="140" y2="66"/>
    <line x1="160" y1="80" x2="160" y2="66"/>
    <!-- left wall -->
    <line x1="102" y1="178" x2="88"  y2="178"/>
    <line x1="102" y1="228" x2="88"  y2="228"/>
    <!-- right wall -->
    <line x1="198" y1="200" x2="212" y2="200"/>
    <line x1="198" y1="240" x2="212" y2="240"/>
    <!-- down, onto the liquid surface -->
    <line x1="120" y1="238" x2="120" y2="250"/>
    <line x1="180" y1="238" x2="180" y2="250"/>
  </g>
  <text x="60" y="196" font-size="10" font-weight="600" fill="#D1502E" text-anchor="middle">trykk</text>
  <text x="60" y="208" font-size="9" fill="#5C6B78" text-anchor="middle">i alle</text>
  <text x="60" y="218" font-size="9" fill="#5C6B78" text-anchor="middle">retninger</text>

  <!-- ===== MAGNIFIER on the wall ===== -->
  <circle cx="214" cy="204" r="27" fill="none" stroke="#26408B" stroke-width="2"/>
  <line x1="238" y1="188" x2="382" y2="112" stroke="#26408B" stroke-width="1" stroke-dasharray="4 3" opacity=".65"/>
  <line x1="238" y1="222" x2="382" y2="300" stroke="#26408B" stroke-width="1" stroke-dasharray="4 3" opacity=".65"/>

  <!-- ===== LENS INSET ===== -->
  <circle cx="512" cy="206" r="132" fill="#0F1620"/>
  <g clip-path="url(#lensClip)">
    <!-- glass wall inside the lens -->
    <rect x="596" y="60" width="60" height="300" fill="url(#glassGrad)" opacity=".92"/>
    <line x1="596" y1="60" x2="596" y2="360" stroke="#8FA3B5" stroke-width="2.5"/>
    <text x="626" y="112" font-size="11" font-weight="700" fill="#5C6B78" text-anchor="middle"
          transform="rotate(90 626 112)">glass</text>

    <!-- bounce 1 -->
    <line x1="400" y1="128" x2="590" y2="168" stroke="#26408B" stroke-width="2.4" marker-end="url(#mBlue)"/>
    <line x1="590" y1="172" x2="404" y2="212" stroke="#D1502E" stroke-width="2.4" marker-end="url(#mWarm)"/>
    <circle cx="400" cy="128" r="6" fill="#26408B"/>
    <circle cx="404" cy="212" r="6" fill="#D1502E"/>
    <circle cx="593" cy="170" r="4.5" fill="#D1502E"/>

    <!-- bounce 2 -->
    <line x1="412" y1="268" x2="590" y2="246" stroke="#26408B" stroke-width="2.4" marker-end="url(#mBlue)"/>
    <line x1="590" y1="250" x2="420" y2="300" stroke="#D1502E" stroke-width="2.4" marker-end="url(#mWarm)"/>
    <circle cx="412" cy="268" r="6" fill="#26408B"/>
    <circle cx="420" cy="300" r="6" fill="#D1502E"/>
    <circle cx="593" cy="248" r="4.5" fill="#D1502E"/>

    <!-- momentum kicks into the glass -->
    <g stroke="#D1502E" stroke-width="2.6" marker-end="url(#mWarm)">
      <line x1="598" y1="170" x2="622" y2="170"/>
      <line x1="598" y1="248" x2="622" y2="248"/>
    </g>

    <!-- free molecules -->
    <g fill="#5C77C4" opacity=".9">
      <circle cx="452" cy="180" r="4.5"/><circle cx="500" cy="320" r="4.5"/>
      <circle cx="430" cy="342" r="4.5"/><circle cx="546" cy="120" r="4.5"/>
      <circle cx="470" cy="238" r="4.5"/>
    </g>
  </g>
  <circle cx="512" cy="206" r="132" fill="none" stroke="#26408B" stroke-width="3"/>

  <text x="512" y="356" font-size="11.5" font-weight="700" fill="#26408B" text-anchor="middle">Ett støt = én ørliten dytt på glasset</text>

  <!-- ===== CAPTION STRIP ===== -->
  <rect x="24" y="386" width="672" height="44" rx="9" fill="#F2F5F9" stroke="#26408B" stroke-width="1.2"/>
  <text x="44" y="404" font-size="11.5" fill="#16212B">
    Ett molekyl gir en kraft du aldri kunne målt. Men gassen inneholder i størrelsesorden
    <tspan font-weight="700">10²² molekyler</tspan>, og hvert av dem treffer veggen
    <tspan font-weight="700">milliarder av ganger i sekundet</tspan>.
  </text>
  <text x="44" y="421" font-size="11.5" fill="#5C6B78">
    Summen av alle disse tilfeldige støtene er helt jevn — og det er den vi kjenner som
    <tspan font-weight="700" fill="#D1502E">trykk</tspan>. En makroskopisk egenskap bygget av mikroskopiske hendelser.
  </text>
</svg>
