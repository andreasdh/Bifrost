<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect width="900" height="380" fill="#ffffff"/>

  <!-- panel separators -->
  <line x1="300" y1="40" x2="300" y2="345" stroke="#e3e3e3" stroke-width="1.5"/>
  <line x1="600" y1="40" x2="600" y2="345" stroke="#e3e3e3" stroke-width="1.5"/>

  <!-- ============ PANEL 1: DIPOL – H2O ============ -->
  <text x="150" y="60" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Dipol</text>
  <text x="150" y="82" text-anchor="middle" font-size="14" fill="#777">vann, H&#8322;O</text>

  <!-- net dipole arrow (points toward the negative O) -->
  <line x1="150" y1="118" x2="150" y2="176" stroke="#1a1a1a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="165" y="140" font-size="16" fill="#1a1a1a" font-style="italic">&#956;</text>

  <!-- bonds -->
  <line x1="150" y1="212" x2="98" y2="172" stroke="#666" stroke-width="4"/>
  <line x1="150" y1="212" x2="202" y2="172" stroke="#666" stroke-width="4"/>
  <!-- atoms -->
  <circle cx="150" cy="212" r="26" fill="#d64545"/>
  <text x="150" y="218" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">O</text>
  <circle cx="98" cy="172" r="17" fill="#3b6fb0"/>
  <text x="98" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">H</text>
  <circle cx="202" cy="172" r="17" fill="#3b6fb0"/>
  <text x="202" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">H</text>
  <!-- charges -->
  <text x="150" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#d64545">&#948;&#8722;</text>
  <text x="70" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#3b6fb0">&#948;+</text>
  <text x="230" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#3b6fb0">&#948;+</text>
  <!-- caption -->
  <text x="150" y="322" text-anchor="middle" font-size="13" fill="#333">Netto dipolmoment &#8800; 0</text>

  <!-- ============ PANEL 2: KVADRUPOL – CO2 ============ -->
  <text x="450" y="60" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Kvadrupol</text>
  <text x="450" y="82" text-anchor="middle" font-size="14" fill="#777">karbondioksid, CO&#8322;</text>

  <!-- bond dipoles that cancel -->
  <line x1="448" y1="150" x2="406" y2="150" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="452" y1="150" x2="494" y2="150" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="450" y="132" text-anchor="middle" font-size="12" fill="#555" font-style="italic">bindingsdipoler kanselerer</text>

  <!-- double bonds -->
  <line x1="402" y1="200" x2="430" y2="200" stroke="#666" stroke-width="3"/>
  <line x1="402" y1="210" x2="430" y2="210" stroke="#666" stroke-width="3"/>
  <line x1="470" y1="200" x2="498" y2="200" stroke="#666" stroke-width="3"/>
  <line x1="470" y1="210" x2="498" y2="210" stroke="#666" stroke-width="3"/>
  <!-- atoms -->
  <circle cx="378" cy="205" r="24" fill="#d64545"/>
  <text x="378" y="211" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">O</text>
  <circle cx="450" cy="205" r="20" fill="#3b6fb0"/>
  <text x="450" y="211" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">C</text>
  <circle cx="522" cy="205" r="24" fill="#d64545"/>
  <text x="522" y="211" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">O</text>
  <!-- charges -->
  <text x="378" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#d64545">&#948;&#8722;</text>
  <text x="450" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#3b6fb0">&#948;+</text>
  <text x="522" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#d64545">&#948;&#8722;</text>
  <!-- caption -->
  <text x="450" y="322" text-anchor="middle" font-size="13" fill="#333">Dipol = 0, kvadrupol &#8800; 0</text>

  <!-- ============ PANEL 3: OKTUPOL – CH4 ============ -->
  <text x="750" y="60" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Oktupol</text>
  <text x="750" y="82" text-anchor="middle" font-size="14" fill="#777">metan, CH&#8324; (tetraedrisk)</text>

  <!-- back bonds (dashed) -->
  <line x1="750" y1="203" x2="704" y2="158" stroke="#999" stroke-width="3" stroke-dasharray="4 4"/>
  <line x1="750" y1="203" x2="796" y2="158" stroke="#999" stroke-width="3" stroke-dasharray="4 4"/>
  <!-- front bonds (solid wedges) -->
  <polygon points="750,203 707.6,254.5 700.4,247.5" fill="#666"/>
  <polygon points="750,203 799.6,247.5 792.4,254.5" fill="#666"/>
  <!-- central C -->
  <circle cx="750" cy="203" r="22" fill="#d64545"/>
  <text x="750" y="209" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">C</text>
  <!-- H atoms -->
  <circle cx="704" cy="155" r="15" fill="#3b6fb0"/>
  <text x="704" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">H</text>
  <circle cx="796" cy="155" r="15" fill="#3b6fb0"/>
  <text x="796" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">H</text>
  <circle cx="704" cy="251" r="15" fill="#3b6fb0"/>
  <text x="704" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">H</text>
  <circle cx="796" cy="251" r="15" fill="#3b6fb0"/>
  <text x="796" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">H</text>
  <!-- charge labels -->
  <text x="750" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#d64545">&#948;&#8722;</text>
  <text x="676" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#3b6fb0">&#948;+</text>
  <text x="824" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#3b6fb0">&#948;+</text>
  <!-- caption -->
  <text x="750" y="322" text-anchor="middle" font-size="13" fill="#333">Dipol = 0, kvadrupol = 0, oktupol &#8800; 0</text>
</svg>
