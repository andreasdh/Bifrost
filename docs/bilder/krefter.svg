<svg width="100%" viewBox="0 0 680 290" role="img" style="" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Keesom-, Debye- og London-krefter</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Illustrasjon av tre typer van der Waals-vekselvirkninger. Keesom-krefter oppstår mellom to permanente dipoler som tiltrekker hverandre, vist med konvergerende piler. Debye-krefter oppstår når en permanent dipol induserer en svakere dipol i et upolart molekyl, vist med en pil som peker fra den permanente dipolen mot det induserte molekylet. London-dispersjonskrefter oppstår mellom to upolare molekyler med korrelerte, fluktuerende ladningsforskyvninger, vist med gjentatte, forskjøvne stiplede omriss som antyder bevegelse over tid.</desc>
