  #sim-2bokser-n5-k4e7 .b-readout {

  #sim-2bokser-n5-k4e7 .b-chart-title { font-size: .85rem; color: var(--s2b-muted); margin: 0 0 .5rem; }

  #sim-2bokser-n5-k4e7 .b-bar-n { font-size: .65rem; color: var(--s2b-muted); }

    padding: .35rem .5rem;

  }
</style>

<script>
(function () {
  const root = document.getElementById('sim-2bokser-n5-k4e7');
  if (!root) return;

  const N = 5;

  root.innerHTML = `
    <p class="b-title">Fem partikler fordelt mellom to bokser</p>
    <p class="b-sub">Klikk på en partikkel for å flytte den til den andre boksen.</p>

    <div class="b-buttons">
      <button class="b-btn b-shuffle-fixed">Ny mikrotilstand (samme fordeling)</button>
      <button class="b-btn b-shuffle-random">Helt tilfeldig</button>
      <button class="b-btn b-reset">Nullstill</button>
    </div>

    <div class="b-boxes">
      <div class="b-box">
        <div class="b-box-label">Boks A</div>
        <div class="b-particles b-box-a"></div>
      </div>
      <div class="b-box">
        <div class="b-box-label">Boks B</div>
        <div class="b-particles b-box-b"></div>
      </div>
    </div>

    <p class="b-chart-title">Multiplisitet Ω(n_A) for hver mulig makrotilstand</p>
    <div class="b-chart-wrap">
      <span class="b-yaxis-label">Multiplisitet, Ω(n_A)</span>
      <div class="b-chart-col">
        <div class="b-chart"></div>
        <div class="b-xaxis-label">Antall partikler i boks A, n_A</div>
      </div>
    </div>
  `;

  // state[i] = true -> partikkel i er i boks A
  let state = new Array(N).fill(false);

  function binomCoeffs(n) {
    const row = [1];
    for (let k = 1; k <= n; k++) row.push(Math.round(row[k - 1] * (n - k + 1) / k));
    return row;
  }
  const coeffs = binomCoeffs(N); // gjelder alltid, N er fast

  function resetState(allB) {
    state = new Array(N).fill(false);
    if (!allB) {
      for (let i = 0; i < N; i++) state[i] = Math.random() < 0.5;
    }
  }

  function shuffleKeepingN() {
    const nA = state.filter(Boolean).length;
    const arr = new Array(N).fill(false);
    const idx = [...Array(N).keys()];
    for (let i = idx.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [idx[i], idx[j]] = [idx[j], idx[i]];
    }
    for (let i = 0; i < nA; i++) arr[idx[i]] = true;
    state = arr;
  }

  function particleHTML(i) {
    return `<div class="b-particle ${state[i] ? 'a' : 'b'}" data-i="${i}">${i + 1}</div>`;
  }

  function render() {
    const nA = state.filter(Boolean).length;
    const nB = N - nA;
    const omega = coeffs[nA];

    const boxA = root.querySelector('.b-box-a');
    const boxB = root.querySelector('.b-box-b');
    boxA.innerHTML = state.map((v, i) => v ? particleHTML(i) : '').join('');
    boxB.innerHTML = state.map((v, i) => !v ? particleHTML(i) : '').join('');

    root.querySelectorAll('.b-particle').forEach(el => {
      el.addEventListener('click', () => {
        const i = +el.dataset.i;
        state[i] = !state[i];
        render();
      });
    });

    const maxOmega = Math.max(...coeffs);
    root.querySelector('.b-chart').innerHTML = coeffs.map((c, k) => `
      <div class="b-bar-col">
        <div class="b-bar${k === nA ? ' b-current' : ''}" style="height:${Math.max(3, (c / maxOmega) * 100)}%"></div>
        <span class="b-bar-n">${k}</span>
      </div>
    `).join('');
  }

  root.querySelector('.b-shuffle-fixed').addEventListener('click', () => { shuffleKeepingN(); render(); });
  root.querySelector('.b-shuffle-random').addEventListener('click', () => { resetState(false); render(); });
  root.querySelector('.b-reset').addEventListener('click', () => { resetState(true); render(); });

  resetState(true);
  render();
})();
</script>
