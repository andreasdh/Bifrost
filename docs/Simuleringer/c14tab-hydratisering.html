<iframe srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;no&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
&lt;title&gt;C&amp;#8321;&amp;#8324;-TAB i vann&lt;/title&gt;
&lt;style&gt;
  :root{
    --ink:#2b2a27;
    --paper:#faf8f4;
    --card:#ffffff;
    --line:#ddd8cd;
    --cation:#3a6ea5;
    --cation-dark:#274a72;
    --tail:#4a4a46;
    --oxygen:#c0392b;
    --oxygen-dark:#8a2f22;
    --hydrogen:#f5f1e8;
    --hbond:#b9832f;
    --font: &quot;Iowan Old Style&quot;,&quot;Palatino Linotype&quot;,Georgia,serif;
    --font-ui: -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-ui);
    padding:32px 16px 48px;
    display:flex;
    justify-content:center;
  }
  .card{
    max-width:780px;
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:28px 32px 32px;
  }
  h1{
    font-family:var(--font);
    font-size:21px;
    font-weight:600;
    margin:0 0 4px;
  }
  .formula{
    font-family:var(--font);
    font-size:16px;
    color:var(--ink);
    opacity:0.85;
    margin:0 0 20px;
  }
  .formula sub{ font-size:0.68em; }

  .stage{ position:relative; width:100%; }
  svg{ width:100%; height:auto; display:block; overflow:visible; }

  .label{
    font-family:var(--font-ui);
    font-size:12.5px;
    fill:var(--ink);
    opacity:0.7;
  }

  .bond-tail{ stroke:var(--tail); stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .head-circle{ fill:var(--cation); stroke:var(--cation-dark); stroke-width:1.5; }
  .head-label{ font-family:var(--font-ui); font-size:12px; font-weight:700; fill:#fff; text-anchor:middle; }

  .bond{ stroke:#8a8578; stroke-width:1.5; }
  .hydrogen{ fill:var(--hydrogen); stroke:#8a8578; stroke-width:1; }
  .oxygen{ fill:var(--oxygen); stroke:var(--oxygen-dark); stroke-width:1; }

  .water-outer{ transition: transform 1.3s ease; }

  .iondipole-line, .cage-line{
    stroke:var(--hbond);
    stroke-width:1.3;
    stroke-dasharray:3 3;
    opacity:0;
    transition:opacity 0.6s ease 1.1s;
  }
  .reacted .iondipole-line, .reacted .cage-line{ opacity:0.65; }

  .controls{
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:18px;
    flex-wrap:wrap;
  }
  button{
    font-family:var(--font-ui);
    font-size:14.5px;
    font-weight:600;
    padding:10px 18px;
    border-radius:8px;
    border:1px solid var(--cation-dark);
    background:var(--cation);
    color:#fff;
    cursor:pointer;
  }
  button:hover{ background:var(--cation-dark); }
  button:focus-visible{ outline:3px solid #274a7255; outline-offset:2px; }
  .state-text{
    font-size:13.5px;
    color:var(--ink);
    opacity:0.75;
  }

  .legend{
    display:flex;

    opacity:0.8;

  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .swatch{ width:11px; height:11px; border-radius:50%; display:inline-block; }

  .caption{
    margin-top:20px;
    font-size:13.5px;
    line-height:1.55;
    color:var(--ink);
    opacity:0.85;
  }

  @media (prefers-reduced-motion: reduce){
    .water-outer, .iondipole-line, .cage-line{ transition:none; }
  }
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div class=&quot;card&quot;&gt;
  &lt;h1&gt;Hydratisering av C&lt;sub&gt;14&lt;/sub&gt;-TAB&lt;/h1&gt;
  &lt;p class=&quot;formula&quot;&gt;Tetradecyltrimetylammoniumbromid &amp;mdash; forenklet modell av kationet&lt;/p&gt;

  &lt;div class=&quot;stage&quot;&gt;
    &lt;svg id=&quot;scene&quot; viewBox=&quot;0 0 700 460&quot; role=&quot;img&quot; aria-label=&quot;Animasjon av vannmolekyler som ordner seg rundt en forenklet modell av C14-TAB n&amp;#229;r det l&amp;#248;ses i vann&quot;&gt;
      &lt;desc&gt;En forenklet modell av C14-TAB-kationet med et ladet hode og en lang hydrokarbonhale er omgitt av vannmolekyler. N&amp;#229;r reaksjonen startes, ordner noen vannmolekyler seg rundt det ladede hodet, og noen ordner seg langs den hydrofobe halen.&lt;/desc&gt;

      &lt;text x=&quot;18&quot; y=&quot;26&quot; class=&quot;label&quot;&gt;Vannmolekyler (l&amp;#248;sningsmiddel)&lt;/text&gt;

      &lt;g id=&quot;tailGroup&quot;&gt;&lt;/g&gt;
      &lt;g id=&quot;bondLayer&quot;&gt;&lt;/g&gt;
      &lt;g id=&quot;waterLayer&quot;&gt;&lt;/g&gt;

      &lt;text id=&quot;headText&quot; x=&quot;500&quot; y=&quot;278&quot; text-anchor=&quot;middle&quot; class=&quot;label&quot; opacity=&quot;0.75&quot;&gt;hydrofilt hode&lt;/text&gt;
      &lt;text id=&quot;tailText&quot; x=&quot;330&quot; y=&quot;278&quot; text-anchor=&quot;middle&quot; class=&quot;label&quot; opacity=&quot;0.75&quot;&gt;hydrofob hale (C14-kjede)&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/div&gt;

  &lt;div class=&quot;controls&quot;&gt;
    &lt;button id=&quot;toggleBtn&quot;&gt;L&amp;#248;s C14-TAB i vann&lt;/button&gt;
    &lt;span class=&quot;state-text&quot; id=&quot;stateText&quot;&gt;Vannmolekylene beveger seg fritt og tilfeldig omkring molekylet.&lt;/span&gt;
  &lt;/div&gt;

  &lt;div class=&quot;legend&quot;&gt;
    &lt;span&gt;&lt;span class=&quot;swatch&quot; style=&quot;background:var(--cation)&quot;&gt;&lt;/span&gt;Kationisk hode&lt;/span&gt;
    &lt;span&gt;&lt;span class=&quot;swatch&quot; style=&quot;background:var(--tail)&quot;&gt;&lt;/span&gt;Hydrokarbonhale&lt;/span&gt;
    &lt;span&gt;&lt;span class=&quot;swatch&quot; style=&quot;background:var(--oxygen)&quot;&gt;&lt;/span&gt;Oksygen (vann)&lt;/span&gt;
    &lt;span&gt;&lt;span class=&quot;swatch&quot; style=&quot;background:var(--hydrogen);border:1px solid #8a8578&quot;&gt;&lt;/span&gt;Hydrogen (vann)&lt;/span&gt;
  &lt;/div&gt;

  &lt;p class=&quot;caption&quot;&gt;
    Bruk animasjonen til &amp;#229; tenke gjennom hvordan vannmolekylene rundt de ulike delene av molekylet p&amp;#229;virker bevegelsesfrihet og orden i l&amp;#248;sningen &amp;mdash; og hva slags vekselvirkninger som oppst&amp;#229;r mellom vann og de ladede/upolare delene av C14-TAB.
  &lt;/p&gt;
&lt;/div&gt;

&lt;script&gt;
(function(){
  const svgNS = &quot;http://www.w3.org/2000/svg&quot;;
  const waterLayer = document.getElementById(&#x27;waterLayer&#x27;);
  const bondLayer = document.getElementById(&#x27;bondLayer&#x27;);
  const tailGroup = document.getElementById(&#x27;tailGroup&#x27;);
  const reducedMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;

  const HEAD = { x:500, y:230, r:16 };
  const TAIL_POINTS = [
    [480,230],[452,246],[424,214],[396,246],[368,214],[340,246],
    [312,214],[284,246],[256,214],[228,246],[200,214],[172,230]
  ];

  function el(tag, attrs){
    const e = document.createElementNS(svgNS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // --- draw the C14-TAB skeleton ---
  let pathD = `M ${HEAD.x-HEAD.r} ${HEAD.y}`;
  TAIL_POINTS.forEach(([x,y]) =&gt; { pathD += ` L ${x} ${y}`; });
  tailGroup.appendChild(el(&#x27;path&#x27;, { d: pathD, class:&#x27;bond-tail&#x27; }));
  tailGroup.appendChild(el(&#x27;circle&#x27;, { cx:HEAD.x, cy:HEAD.y, r:HEAD.r, class:&#x27;head-circle&#x27; }));
  const headLabel = el(&#x27;text&#x27;, { x:HEAD.x, y:HEAD.y+4, class:&#x27;head-label&#x27; });
  headLabel.textContent = &#x27;N+&#x27;;
  tailGroup.appendChild(headLabel);

  // --- water molecule factory ---
  function makeWater(){
    const outer = el(&#x27;g&#x27;, { class:&#x27;water-outer&#x27; });
    const jitter = el(&#x27;g&#x27;, { class:&#x27;water-jitter&#x27; });
    const mol = el(&#x27;g&#x27;, {});
    mol.appendChild(el(&#x27;line&#x27;, { x1:0, y1:8, x2:-9, y2:-6, class:&#x27;bond&#x27; }));
    mol.appendChild(el(&#x27;line&#x27;, { x1:0, y1:8, x2:9,  y2:-6, class:&#x27;bond&#x27; }));
    mol.appendChild(el(&#x27;circle&#x27;, { cx:-9, cy:-6, r:3.4, class:&#x27;hydrogen&#x27; }));
    mol.appendChild(el(&#x27;circle&#x27;, { cx:9,  cy:-6, r:3.4, class:&#x27;hydrogen&#x27; }));
    mol.appendChild(el(&#x27;circle&#x27;, { cx:0,  cy:8,  r:5.2, class:&#x27;oxygen&#x27; }));
    jitter.appendChild(mol);
    outer.appendChild(jitter);
    waterLayer.appendChild(outer);
    return { outer, jitter };
  }

  function setTransform(g, x, y, rotDeg){
    g.style.transform = `translate(${x}px,${y}px) rotate(${rotDeg}deg)`;
  }

  function orientToward(fromX, fromY, toX, toY){
    const dx = toX - fromX, dy = toY - fromY;
    const len = Math.hypot(dx,dy) || 1;
    const ux = dx/len, uy = dy/len;
    return Math.atan2(-ux, uy) * 180 / Math.PI;
  }

  function rand(min,max){ return min + Math.random()*(max-min); }

  // jitter animation on the inner group (small Brownian motion)
  function jitter(item, amplitude, duration){
    if (item.anim) item.anim.cancel();
    if (reducedMotion) { item.jitter.style.transform = &#x27;&#x27;; return; }
    const dx = rand(-amplitude, amplitude);
    const dy = rand(-amplitude, amplitude);
    item.anim = item.jitter.animate([
      { transform:&#x27;translate(0px,0px)&#x27; },
      { transform:`translate(${dx}px, ${dy}px)` },
      { transform:&#x27;translate(0px,0px)&#x27; }
    ], { duration, iterations: Infinity, easing:&#x27;ease-in-out&#x27; });
  }

  // scatter zone for the &quot;before&quot; / bulk state
  const scatterZone = () =&gt; {
    let x, y;
    do {
      x = rand(30, 670);
      y = rand(40, 440);
    } while (Math.hypot(x-HEAD.x, y-HEAD.y) &lt; 60 &amp;&amp;
             x &gt; 150 &amp;&amp; x &lt; 560 &amp;&amp; y &gt; 170 &amp;&amp; y &lt; 300);
    return [x,y];
  };

  // --- shell waters around the charged head ---
  const shellWaters = [];
  const shellAngles = [0, 60, 120, 180, 240, 300];
  shellAngles.forEach(deg =&gt; {
    const rad = deg * Math.PI/180;
    const tx = HEAD.x + 36*Math.cos(rad);
    const ty = HEAD.y + 36*Math.sin(rad);
    const rot = orientToward(tx, ty, HEAD.x, HEAD.y);
    const item = makeWater();
    const [sx,sy] = scatterZone();
    setTransform(item.outer, sx, sy, rand(0,360));
    jitter(item, 9, 2400 + Math.random()*700);
    const bondLine = el(&#x27;line&#x27;, { x1:tx, y1:ty, x2:HEAD.x, y2:HEAD.y, class:&#x27;iondipole-line&#x27; });
    bondLayer.appendChild(bondLine);
    shellWaters.push({ item, tx, ty, rot });
  });

  // --- cage waters along the hydrophobic tail ---
  const cageWaters = [];
  [1,3,5,7,9].forEach(i =&gt; {
    const [px,py] = TAIL_POINTS[i];
    [-1,1].forEach(side =&gt; {
      const tx = px, ty = py + side*24;
      const rot = side === -1 ? -15 : 15;
      const item = makeWater();
      const [sx,sy] = scatterZone();
      setTransform(item.outer, sx, sy, rand(0,360));
      jitter(item, 9, 2400 + Math.random()*700);
      const bondLine = el(&#x27;line&#x27;, { x1:tx, y1:ty, x2:px, y2:py, class:&#x27;cage-line&#x27; });
      bondLayer.appendChild(bondLine);
      cageWaters.push({ item, tx, ty, rot });
    });
  });

  // --- bulk waters, always disordered ---
  const bulkWaters = [];
  for(let i=0;i&lt;14;i++){
    const item = makeWater();
    const [sx,sy] = scatterZone();
    setTransform(item.outer, sx, sy, rand(0,360));
    jitter(item, 9, 2400 + Math.random()*700);
    bulkWaters.push({ item, sx, sy });
  }

  const btn = document.getElementById(&#x27;toggleBtn&#x27;);
  const stateText = document.getElementById(&#x27;stateText&#x27;);
  const stage = document.querySelector(&#x27;.stage&#x27;);
  let reacted = false;

  function react(){
    reacted = true;
    stage.classList.add(&#x27;reacted&#x27;);
    shellWaters.forEach(w =&gt; {
      setTransform(w.item.outer, w.tx, w.ty, w.rot);
      setTimeout(() =&gt; jitter(w.item, 2, 2600), 1250);
    });
    cageWaters.forEach(w =&gt; {
      setTransform(w.item.outer, w.tx, w.ty, w.rot);
      setTimeout(() =&gt; jitter(w.item, 2.5, 2600), 1250);
    });
    btn.textContent = &#x27;Tilbakestill&#x27;;
    stateText.textContent = &#x27;Noen vannmolekyler har nå ordnet seg rundt hodet og halen i molekylet.&#x27;;
  }

  function reset(){
    reacted = false;
    stage.classList.remove(&#x27;reacted&#x27;);
    [...shellWaters, ...cageWaters].forEach(w =&gt; {
      const [sx,sy] = scatterZone();
      setTransform(w.item.outer, sx, sy, rand(0,360));
      jitter(w.item, 9, 2400 + Math.random()*700);
    });
    btn.textContent = &#x27;Løs C14-TAB i vann&#x27;;
    stateText.textContent = &#x27;Vannmolekylene beveger seg fritt og tilfeldig omkring molekylet.&#x27;;
  }

  btn.addEventListener(&#x27;click&#x27;, () =&gt; { reacted ? reset() : react(); });
})();
&lt;/script&gt;
&lt;/body&gt;
