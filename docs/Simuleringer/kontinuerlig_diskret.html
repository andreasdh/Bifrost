<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontinuerlig og diskret energi</title>
<style>
  :root{
    --ink:#1c2321;--paper:#f5f2ea;--grid:#d8d2c4;--axis:#6b6252;
    --cont:#1f5f8b;--disc:#c0392b;--muted:#7d7566;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;padding:22px;line-height:1.5;}
  .wrap{max-width:560px;margin:0 auto;}
  .eyebrow{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  h1{font-size:25px;font-weight:600;letter-spacing:-.01em;margin-bottom:4px;}
  .sub{color:var(--muted);font-size:15px;margin-bottom:18px;}
  .stage{background:var(--paper);border:1px solid var(--grid);border-radius:4px;padding:12px;}
  svg{display:block;width:100%;height:auto;touch-action:none;}
  .toggle{display:flex;gap:8px;margin-top:16px;}
  .toggle button{flex:1;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13px;
    padding:10px 14px;border:1px solid var(--axis);background:transparent;color:var(--ink);
    border-radius:3px;cursor:pointer;transition:background .15s,color .15s;}
  .toggle button:hover{background:var(--ink);color:var(--paper);}
  .toggle button.active{color:var(--paper);}
  .toggle button.active.cont{background:var(--cont);border-color:var(--cont);}
  .toggle button.active.disc{background:var(--disc);border-color:var(--disc);}
  .note{margin-top:16px;font-size:14px;color:var(--muted);border-left:2px solid var(--axis);padding-left:12px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Kvantisering</div>
  <h1>Kontinuerlig og diskret energi</h1>
  <p class="sub">Dra kulen opp og ned. I kontinuerlig modus glir den glatt langs linjen; i diskret modus hopper den hakkete fra nivå til nivå.</p>
  <div class="stage">
    <svg id="viz" viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="toggle">
    <button id="btnCont" class="cont active">Kontinuerlig</button>
    <button id="btnDisc" class="disc">Diskret</button>
  </div>
  <p class="note" id="explain">I kontinuerlig modus kan energien ha en hvilken som helst verdi langs linjen.</p>
</div>
<script>
(function(){
  const NS="http://www.w3.org/2000/svg";
  const svg=document.getElementById('viz');
  const VBW=480, VBH=360;
  const yBottom=310, yTop=60;
  const xAxis=70;
  const N=4;
  const levelY=[];
  for(let i=0;i<N;i++) levelY.push(yBottom - i*(yBottom-yTop)/(N-1));
  const LX1=120, LY1=yBottom, LX2=360, LY2=yTop;
  let mode="cont";
  let energy=0.35;
  let level=1;
  let dragging=false;
  const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  function draw(){
    while(svg.firstChild)svg.removeChild(svg.firstChild);
    const defs=el('defs',{});
    const m=el('marker',{id:'axA',markerWidth:12,markerHeight:12,refX:4,refY:9,orient:'auto',markerUnits:'userSpaceOnUse'});
    m.appendChild(el('path',{d:'M 0 9 L 4 0 L 8 9',fill:'none',stroke:'#6b6252','stroke-width':1.8}));
    defs.appendChild(m); svg.appendChild(defs);
    svg.appendChild(el('line',{x1:xAxis,y1:yBottom+20,x2:xAxis,y2:yTop-20,stroke:'var(--axis)','stroke-width':2,'marker-end':'url(#axA)'}));
    const eLab=el('text',{x:xAxis-16,y:yTop-6,'text-anchor':'middle','font-size':18,fill:'#1c2321','font-style':'italic','font-family':'Georgia, serif'});
    eLab.textContent='E'; svg.appendChild(eLab);
    if(mode==="cont"){
      svg.appendChild(el('line',{x1:LX1,y1:LY1,x2:LX2,y2:LY2,stroke:'var(--cont)','stroke-width':3.5}));
      const bx=LX1+energy*(LX2-LX1);
      const by=LY1+energy*(LY2-LY1);
      svg.appendChild(el('line',{x1:xAxis,y1:by,x2:bx,y2:by,stroke:'var(--cont)','stroke-width':1,'stroke-dasharray':'4 4','stroke-opacity':0.5}));
      svg.appendChild(el('circle',{cx:bx,cy:by,r:12,fill:'var(--cont)',stroke:'var(--paper)','stroke-width':2.5,style:'cursor:grab'}));
    } else {
      for(let i=0;i<N;i++){
        svg.appendChild(el('line',{x1:120,y1:levelY[i],x2:400,y2:levelY[i],stroke:'var(--disc)','stroke-width':3}));
        const lab=el('text',{x:104,y:levelY[i]+6,'text-anchor':'end','font-size':16,fill:'#1c2321','font-family':'Georgia, serif'});
        lab.textContent='E'+i; svg.appendChild(lab);
      }
      svg.appendChild(el('circle',{cx:260,cy:levelY[level],r:12,fill:'var(--disc)',stroke:'var(--paper)','stroke-width':2.5,style:'cursor:grab'}));
    }
  }
  function pointerFrac(ev){
    const r=svg.getBoundingClientRect();
    const t=ev.touches?ev.touches[0]:ev;
    const py=(t.clientY-r.top)/r.height*VBH;
    let f=(yBottom-py)/(yBottom-yTop);
    return Math.max(0,Math.min(1,f));
  }
  function onMove(ev){
    if(!dragging)return;
    const f=pointerFrac(ev);
    if(mode==="cont"){ energy=f; }
    else{ level=Math.round(f*(N-1)); }
    draw();
    ev.preventDefault();
  }
  function onDown(ev){ dragging=true; onMove(ev); }
  function onUp(){ dragging=false; }
  svg.addEventListener('mousedown',onDown);
  window.addEventListener('mousemove',onMove);
  window.addEventListener('mouseup',onUp);
  svg.addEventListener('touchstart',onDown,{passive:false});
  svg.addEventListener('touchmove',onMove,{passive:false});
  window.addEventListener('touchend',onUp);
  function setMode(mo){
    mode=mo;
    document.getElementById('btnCont').classList.toggle('active',mo==="cont");
    document.getElementById('btnDisc').classList.toggle('active',mo==="disc");
    document.getElementById('explain').textContent = mo==="cont"
      ? "I kontinuerlig modus kan energien ha en hvilken som helst verdi langs linjen."
      : "I diskret modus er bare bestemte energinivåer tillatt - kulen hopper mellom dem.";
    draw();
  }
  document.getElementById('btnCont').addEventListener('click',()=>setMode("cont"));
  document.getElementById('btnDisc').addEventListener('click',()=>setMode("disc"));
  draw();
})();
</script>
</body>
</html>
