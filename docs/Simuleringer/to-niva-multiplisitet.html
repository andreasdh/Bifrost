</style>

<script>
(function () {
  const root = document.getElementById('sim-2niva-multiplisitet-a1c9');
  if (!root) return;

  root.innerHTML = `
    <div class="tns-head">
      <p class="tns-title">To-nivå-system: mikrotilstander og multiplisitet</p>
    </div>
    <p class="tns-sub">Hver partikkel kan være i grunntilstanden (energi 0) eller den eksiterte tilstanden (energi ε). Klikk på en partikkel for å eksitere/de-eksitere den.</p>

    <div class="tns-controls">
      <div class="tns-slider-wrap">
        <label>Antall partikler N</label>
        <input type="range" class="tns-N" min="2" max="16" value="8" step="1">
        <span class="tns-n-val">8</span>
      </div>
      <div class="tns-buttons">
        <button class="tns-btn tns-shuffle-fixed">Ny mikrotilstand (samme energi)</button>
        <button class="tns-btn tns-shuffle-random">Helt tilfeldig</button>
        <button class="tns-btn tns-reset">Nullstill</button>
      </div>
    </div>

    <div class="tns-particles"></div>

    <div class="tns-readout">
      <div class="tns-metric">
        <span class="tns-label">Mikrotilstand</span>
        <span class="tns-value tns-micro">–</span>
      </div>
      <div class="tns-metric">
        <span class="tns-label">Makrotilstand (energi)</span>
        <span class="tns-value tns-macro">E = 0</span>
      </div>
      <div class="tns-metric">
        <span class="tns-label">Multiplisitet Ω(n)</span>
        <span class="tns-value tns-omega">Ω = 1</span>
      </div>
    </div>

    <p class="tns-chart-title">Multiplisitet Ω(n) for hver mulig makrotilstand</p>
    <div class="tns-chart-wrap">
      <span class="tns-yaxis-label">Multiplisitet, Ω(n)</span>
      <div class="tns-chart-col">
        <div class="tns-chart"></div>
        <div class="tns-xaxis-label">Antall eksiterte partikler, n</div>
      </div>
    </div>
  `;

  let N = 8;
  let state = [];

  function binomCoeffs(n) {
    const row = [1];
    for (let k = 1; k <= n; k++) {
      row.push(Math.round(row[k - 1] * (n - k + 1) / k));
    }
    return row;
  }

  function resetState(fillFalse = true) {
    state = new Array(N).fill(false);
    if (!fillFalse) {
      for (let i = 0; i < N; i++) state[i] = Math.random() < 0.5;
    }
  }

  function shuffleKeepingN() {
    const n = state.filter(Boolean).length;
    const arr = new Array(N).fill(false);
    const idx = [...Array(N).keys()];
    for (let i = idx.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [idx[i], idx[j]] = [idx[j], idx[i]];
    }
    for (let i = 0; i < n; i++) arr[idx[i]] = true;
    state = arr;
  }

  function render() {
    const n = state.filter(Boolean).length;
    const coeffs = binomCoeffs(N);
    const omega = coeffs[n];

    // particles
    const pcont = root.querySelector('.tns-particles');
    pcont.innerHTML = state.map((excited, i) => `
      <div class="tns-particle${excited ? ' excited' : ''}" data-i="${i}" title="Partikkel ${i + 1}">
        <span class="tns-lvl-label top">ε</span>
        <span class="tns-lvl-label bottom">0</span>
        <div class="tns-line top"></div>
        <div class="tns-line bottom"></div>
        <div class="tns-dot"></div>
      </div>
    `).join('');
    pcont.querySelectorAll('.tns-particle').forEach(el => {
      el.addEventListener('click', () => {
        const i = +el.dataset.i;
        state[i] = !state[i];
        render();
      });
    });

    // readouts
    root.querySelector('.tns-micro').textContent =
      state.map(e => e ? '↑' : '↓').join(' ');
    root.querySelector('.tns-macro').textContent = `E = ${n}ε  (${n} av ${N} eksitert)`;
    root.querySelector('.tns-omega').innerHTML =
      `Ω(${n}) = <span class="tns-binom"><span class="tns-binom-paren">(</span><span class="tns-binom-col"><span>${N}</span><span>${n}</span></span><span class="tns-binom-paren">)</span></span> = ${omega}`;

    // chart
    const maxOmega = Math.max(...coeffs);
    const chart = root.querySelector('.tns-chart');
    chart.innerHTML = coeffs.map((c, k) => `
      <div class="tns-bar-col">
        <div class="tns-bar${k === n ? ' tns-current' : ''}" style="height:${Math.max(3, (c / maxOmega) * 100)}%"></div>
        <span class="tns-bar-n">${k}</span>
      </div>
    `).join('');
  }

  root.querySelector('.tns-N').addEventListener('input', (e) => {
    N = +e.target.value;
    root.querySelector('.tns-n-val').textContent = N;
    resetState(true);
    render();
  });
  root.querySelector('.tns-shuffle-fixed').addEventListener('click', () => {
    shuffleKeepingN();
    render();
  });
  root.querySelector('.tns-shuffle-random').addEventListener('click', () => {
    resetState(false);
    render();
  });
  root.querySelector('.tns-reset').addEventListener('click', () => {
    resetState(true);
    render();
  });

  resetState(true);
  render();
})();
</script>
