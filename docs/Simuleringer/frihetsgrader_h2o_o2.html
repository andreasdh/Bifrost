<div id="fdof-root" style="font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;">
<style>
#fdof-root .fdof-card{border:1px solid #ddd;border-radius:12px;padding:1.25rem;margin-bottom:16px;background:#fafafa;}
#fdof-root .fdof-btn{font-size:12px;padding:6px 10px;width:100%;text-align:left;margin-bottom:6px;border:1px solid #ccc;background:#fff;border-radius:8px;cursor:pointer;color:#222;}
#fdof-root .fdof-btn.fdof-on{background:#eef4fb;border-color:#378ADD;font-weight:600;}
#fdof-root .fdof-btn-off{opacity:0.45;cursor:default;font-style:italic;}
#fdof-root .fdof-group-label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:#999;margin:8px 0 4px;}
#fdof-root .fdof-eq{font-size:16px;margin:0 0 6px;color:#222;}
#fdof-root .fdof-count{font-size:13px;margin:0 0 16px;color:#378ADD;font-weight:600;}
#fdof-root .fdof-count .fdof-part{color:#666;font-weight:400;}
#fdof-root .fdof-label{font-size:13px;color:#666;margin:0 0 4px;font-weight:600;}
@keyframes fdof-trans{0%,100%{transform:translate(-24px,0)}50%{transform:translate(24px,0)}}
/* rotasjon om z (i planet) */
@keyframes fdof-rotz{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
/* rotasjon om y (loddrett akse): klem horisontalt for pseudo-3D */
@keyframes fdof-roty{0%{transform:scaleX(1)}25%{transform:scaleX(0.15)}50%{transform:scaleX(1)}75%{transform:scaleX(0.15)}100%{transform:scaleX(1)}}
/* rotasjon om x (vannrett akse): klem vertikalt for pseudo-3D */
@keyframes fdof-rotx{0%{transform:scaleY(1)}25%{transform:scaleY(0.15)}50%{transform:scaleY(1)}75%{transform:scaleY(0.15)}100%{transform:scaleY(1)}}
@keyframes fdof-o2v1{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,0)}}
@keyframes fdof-o2v2{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,0)}}
@keyframes fdof-hsym1{0%,100%{transform:translate(0,0)}50%{transform:translate(-4px,5px)}}
@keyframes fdof-hsym2{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,5px)}}
@keyframes fdof-hasym1{0%,100%{transform:translate(0,0)}50%{transform:translate(-4px,5px)}}
@keyframes fdof-hasym2{0%,100%{transform:translate(0,0)}50%{transform:translate(-4px,-5px)}}
@keyframes fdof-hbendO{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-6px)}}
@keyframes fdof-hbendH1{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,3px)}}
@keyframes fdof-hbendH2{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,3px)}}
</style>

<!-- =================== H2O =================== -->
<div class="fdof-card">
<p class="fdof-label">H&#8322;O &mdash; ikke-line&aelig;rt molekyl (N = 3 atomer)</p>
<p id="fdof-h2o-eq" class="fdof-eq">&epsilon;<sub>tot</sub> = &epsilon;<sub>elec</sub> + &epsilon;<sub>trans</sub></p>
<p id="fdof-h2o-count" class="fdof-count"></p>
<div style="display:grid;grid-template-columns:1fr 190px;gap:16px;align-items:center;">
<svg width="100%" viewBox="0 0 220 170" style="overflow:visible;">
  <!-- akser -->
  <g id="fdof-h2o-axes" opacity="0.5">
    <line x1="40" y1="90" x2="180" y2="90" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="184" y="94" font-size="11" fill="#378ADD">x</text>
    <line x1="110" y1="20" x2="110" y2="160" stroke="#2FA84F" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="114" y="30" font-size="11" fill="#2FA84F">y</text>
    <line x1="70" y1="130" x2="150" y2="50" stroke="#B4783A" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="152" y="48" font-size="11" fill="#B4783A">z</text>
  </g>
  <g id="fdof-h2o-trans" style="animation:none;">
  <g id="fdof-h2o-rot" style="transform-origin:110px 90px;">
    <line x1="110" y1="60" x2="75" y2="110" stroke="#3d3d3a" stroke-width="3"/>
    <line x1="110" y1="60" x2="145" y2="110" stroke="#3d3d3a" stroke-width="3"/>
    <g id="fdof-h2o-o" style="transform-origin:110px 60px;"><circle cx="110" cy="60" r="15" fill="#D85A30"/></g>
    <g id="fdof-h2o-h1" style="transform-origin:75px 110px;"><circle cx="75" cy="110" r="11" fill="#B4B2A9"/></g>
    <g id="fdof-h2o-h2" style="transform-origin:145px 110px;"><circle cx="145" cy="110" r="11" fill="#B4B2A9"/></g>
  </g>
  </g>
</svg>
<div>
<p class="fdof-group-label">Translasjon (3)</p>
<button class="fdof-btn" id="fdof-h2o-btn-trans">Bevegelse gjennom rommet</button>
<p class="fdof-group-label">Rotasjon (3 akser)</p>
<button class="fdof-btn" id="fdof-h2o-btn-rotx">Roter om x-aksen</button>
<button class="fdof-btn" id="fdof-h2o-btn-roty">Roter om y-aksen</button>
<button class="fdof-btn" id="fdof-h2o-btn-rotz">Roter om z-aksen</button>
<p class="fdof-group-label">Vibrasjon (3N &minus; 6 = 3)</p>
<button class="fdof-btn" id="fdof-h2o-btn-sym">Symmetrisk strekk</button>
<button class="fdof-btn" id="fdof-h2o-btn-asym">Asymmetrisk strekk</button>
<button class="fdof-btn" id="fdof-h2o-btn-bend">B&oslash;ying</button>
</div>
</div>
</div>

<!-- =================== O2 =================== -->
<div class="fdof-card">
<p class="fdof-label">O&#8322; &mdash; line&aelig;rt molekyl (N = 2 atomer)</p>
<p id="fdof-o2-eq" class="fdof-eq">&epsilon;<sub>tot</sub> = &epsilon;<sub>elec</sub> + &epsilon;<sub>trans</sub></p>
<p id="fdof-o2-count" class="fdof-count"></p>
<div style="display:grid;grid-template-columns:1fr 190px;gap:16px;align-items:center;">
<svg width="100%" viewBox="0 0 220 170" style="overflow:visible;">
  <!-- akser: bindingen ligger langs x -->
  <g id="fdof-o2-axes" opacity="0.5">
    <line x1="40" y1="85" x2="180" y2="85" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="184" y="89" font-size="11" fill="#378ADD">x</text>
    <line x1="110" y1="20" x2="110" y2="150" stroke="#2FA84F" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="114" y="30" font-size="11" fill="#2FA84F">y</text>
    <line x1="75" y1="120" x2="145" y2="50" stroke="#bbb" stroke-width="1.5" stroke-dasharray="2 3"/>
    <text x="147" y="48" font-size="10" fill="#bbb">z</text>
  </g>
  <g id="fdof-o2-trans" style="animation:none;">
  <g id="fdof-o2-rot" style="transform-origin:110px 85px;">
    <line x1="80" y1="85" x2="140" y2="85" stroke="#3d3d3a" stroke-width="3"/>
    <g id="fdof-o2-a1" style="transform-origin:80px 85px;"><circle cx="80" cy="85" r="16" fill="#378ADD"/></g>
    <g id="fdof-o2-a2" style="transform-origin:140px 85px;"><circle cx="140" cy="85" r="16" fill="#378ADD"/></g>
  </g>
  </g>
</svg>
<div>
<p class="fdof-group-label">Translasjon (3)</p>
<button class="fdof-btn" id="fdof-o2-btn-trans">Bevegelse gjennom rommet</button>
<p class="fdof-group-label">Rotasjon (2 akser)</p>
<button class="fdof-btn" id="fdof-o2-btn-roty">Roter om y-aksen</button>
<button class="fdof-btn" id="fdof-o2-btn-rotz">Roter om z-aksen</button>
<button class="fdof-btn fdof-btn-off" id="fdof-o2-btn-rotx" title="Rotasjon om bindingsaksen teller ikke for line&aelig;re molekyler">Om x-aksen: teller ikke</button>
<p class="fdof-group-label">Vibrasjon (3N &minus; 5 = 1)</p>
<button class="fdof-btn" id="fdof-o2-btn-vib">Strekk</button>
</div>
</div>
</div>

<script>
(function () {
  const state = {
    h2o:{trans:false, rotx:false, roty:false, rotz:false, sym:false, asym:false, bend:false},
    o2:{trans:false, roty:false, rotz:false, vib:false}
  };

  function byId(id){ return document.getElementById(id); }

  function toggle(mol,key){
    state[mol][key] = !state[mol][key];
    render(mol);
  }

  // hvilken rotasjons-animasjon som skal vises (prioriter z i planet, ellers y, ellers x)
  function rotAnim(s){
    if(s.rotz) return 'fdof-rotz 2.4s linear infinite';
    if(s.roty) return 'fdof-roty 2.4s ease-in-out infinite';
    if(s.rotx) return 'fdof-rotx 2.4s ease-in-out infinite';
    return 'none';
  }

  function render(mol){
    const s = state[mol];

    for(const k in s){
      const btn = byId('fdof-'+mol+'-btn-'+k);
      if(btn) btn.classList.toggle('fdof-on', s[k]);
    }

    if(mol==='h2o'){
      byId('fdof-h2o-trans').style.animation = s.trans ? 'fdof-trans 1.6s ease-in-out infinite' : 'none';
      byId('fdof-h2o-rot').style.animation = rotAnim(s);

      let h1='none', h2='none', o='none';
      if(s.sym){ h1='fdof-hsym1 .5s ease-in-out infinite'; h2='fdof-hsym2 .5s ease-in-out infinite'; }
      else if(s.asym){ h1='fdof-hasym1 .5s ease-in-out infinite'; h2='fdof-hasym2 .5s ease-in-out infinite'; }
      else if(s.bend){ h1='fdof-hbendH1 .5s ease-in-out infinite'; h2='fdof-hbendH2 .5s ease-in-out infinite'; o='fdof-hbendO .5s ease-in-out infinite'; }
      byId('fdof-h2o-h1').style.animation = h1;
      byId('fdof-h2o-h2').style.animation = h2;
      byId('fdof-h2o-o').style.animation = o;

      let terms = ['&epsilon;<sub>elec</sub>', '&epsilon;<sub>trans</sub>'];
      if(s.rotx||s.roty||s.rotz) terms.push('&epsilon;<sub>rot</sub>');
      if(s.sym||s.asym||s.bend) terms.push('&epsilon;<sub>vib</sub>');
      byId('fdof-h2o-eq').innerHTML = '&epsilon;<sub>tot</sub> = ' + terms.join(' + ');

      const t = s.trans ? 3 : 0;
      const r = (s.rotx?1:0)+(s.roty?1:0)+(s.rotz?1:0);
      const v = (s.sym?1:0)+(s.asym?1:0)+(s.bend?1:0);
      const sum = t + r + v;
      byId('fdof-h2o-count').innerHTML =
        'Frihetsgrader: ' + sum + ' / 9 &nbsp; ' +
        '<span class="fdof-part">(translasjon ' + t + ', rotasjon ' + r + ', vibrasjon ' + v + ')</span>';
    }

    if(mol==='o2'){
      byId('fdof-o2-trans').style.animation = s.trans ? 'fdof-trans 1.6s ease-in-out infinite' : 'none';
      byId('fdof-o2-rot').style.animation = rotAnim(s);
      byId('fdof-o2-a1').style.animation = s.vib ? 'fdof-o2v1 .5s ease-in-out infinite' : 'none';
      byId('fdof-o2-a2').style.animation = s.vib ? 'fdof-o2v2 .5s ease-in-out infinite' : 'none';

      let terms = ['&epsilon;<sub>elec</sub>', '&epsilon;<sub>trans</sub>'];
      if(s.roty||s.rotz) terms.push('&epsilon;<sub>rot</sub>');
      if(s.vib) terms.push('&epsilon;<sub>vib</sub>');
      byId('fdof-o2-eq').innerHTML = '&epsilon;<sub>tot</sub> = ' + terms.join(' + ');

      const t = s.trans ? 3 : 0;
      const r = (s.roty?1:0)+(s.rotz?1:0);
      const v = s.vib ? 1 : 0;
      const sum = t + r + v;
      byId('fdof-o2-count').innerHTML =
        'Frihetsgrader: ' + sum + ' / 6 &nbsp; ' +
        '<span class="fdof-part">(translasjon ' + t + ', rotasjon ' + r + ', vibrasjon ' + v + ')</span>';
    }
  }

  byId('fdof-h2o-btn-trans').addEventListener('click', () => toggle('h2o','trans'));
  byId('fdof-h2o-btn-rotx').addEventListener('click', () => toggle('h2o','rotx'));
  byId('fdof-h2o-btn-roty').addEventListener('click', () => toggle('h2o','roty'));
  byId('fdof-h2o-btn-rotz').addEventListener('click', () => toggle('h2o','rotz'));
  byId('fdof-h2o-btn-sym').addEventListener('click', () => toggle('h2o','sym'));
  byId('fdof-h2o-btn-asym').addEventListener('click', () => toggle('h2o','asym'));
  byId('fdof-h2o-btn-bend').addEventListener('click', () => toggle('h2o','bend'));

  byId('fdof-o2-btn-trans').addEventListener('click', () => toggle('o2','trans'));
  byId('fdof-o2-btn-roty').addEventListener('click', () => toggle('o2','roty'));
  byId('fdof-o2-btn-rotz').addEventListener('click', () => toggle('o2','rotz'));
  // x-aksen for O2 er bevisst uten handler (teller ikke)

  byId('fdof-o2-btn-vib').addEventListener('click', () => toggle('o2','vib'));

  render('h2o');
  render('o2');
})();
</script>
</div>
