<h2 class="sr-only" style="position:absolute;left:-9999px">3D-simulering: nukleofilt angrep på karbonyl med delokalisert π-MO og protonering.</h2>
<style>

<div class="sw"><canvas id="cv"></canvas><div class="ip" id="st">π-binding (delokalisert over C og O) · 2 e⁻ forskjøvet mot O</div><div id="lC" class="lbl">C</div><div id="lO" class="lbl">O</div><div id="lH1" class="lbl">H</div><div id="lH2" class="lbl">H</div><div id="lN" class="lbl">Nu⁻</div><div id="lHp" class="lbl">H⁺</div></div>

<div class="lg"><span class="li"><span class="sq" style="background:#3a3a3a"></span>C</span><span class="li"><span class="sq" style="background:#d85a30"></span>O</span><span class="li"><span class="sq" style="background:#dcdcdc"></span>H</span><span class="li"><span class="sq" style="background:#1d9e75"></span>Nu⁻</span><span class="li"><span class="sq" style="background:#a3d5ff"></span>H⁺</span><span class="li"><span class="sq" style="background:#7f77dd"></span>π-MO / p-orbital</span><span class="li"><span class="sq" style="background:#f0997b"></span>π*</span><span class="li"><span class="sq" style="background:#5dcaa5"></span>σ(C–Nu)</span><span class="li"><span class="sq" style="background:#facc15"></span>elektroner</span></div>

var hpM=new T.MeshPhongMaterial({color:0xa3d5ff,emissive:0x4a90c9,emissiveIntensity:0.2,shininess:90,transparent:true,opacity:0});
var hP=new T.Mesh(new T.SphereGeometry(0.16,16,12),hpM);sc.add(hP);
var BD=107*Math.PI/180,as=1,ap=0,ia=false,pv=true,psv=true;
var tG=new T.BufferGeometry();function tjp(){var r=[];for(var i=0;i<=30;i++){var t=i/30,d=4-2.95*t;r.push(d*Math.cos(BD),d*Math.sin(BD)*as,0)}return r}

var rx=0.25,ry=0.65,dz=7;

var qId=new T.Quaternion();
var qFl=new T.Quaternion().setFromAxisAngle(new T.Vector3(1,0,0),Math.PI);
function us(){
var t=ap,ta=Math.min(t/0.6,1),pp=Math.max((t-0.6)/0.4,0);
var pyr=ss(0.5,1.0,ta),pa=pyr*0.85;
Op.copy(py(Ob,pa));H1p.copy(py(H1b,pa));H2p.copy(py(H2b,pa));

aOD.position.copy(Op);aOD.quaternion.copy(qFl);
var aF=ss(0.25,0.8,ta);

pMOD.opacity=0.55*aF;
aOU.visible=pv;aOD.visible=pv;

psCD.position.set(Cp.x,0,0);psCD.quaternion.copy(qFl);
psOU.position.set(Op.x,Op.y,0);psOU.quaternion.copy(qId);
psOD.position.set(Op.x,Op.y,0);psOD.quaternion.copy(qFl);

var smo=ss(0.45,0.9,ta);smM.opacity=smo*0.5;
if(smo>0.01){var mid=new T.Vector3().addVectors(Cp,nG.position).multiplyScalar(0.5);sMO.position.copy(mid);var bL=new T.Vector3().subVectors(nG.position,Cp).length();sMO.scale.set(0.55,0.55,bL*0.55);sMO.lookAt(nG.position)}else{sMO.scale.set(0.001,0.001,0.001)}
var nf=1-ss(0.5,0.9,ta);nLM.opacity=0.55*nf;ne1.material.opacity=nf;ne2.material.opacity=nf;

var hYS=Op.y+3.5,hYF=Op.y+1.0,hPr=Math.min(pp*1.1,1);hP.position.set(Op.x,hYS+(hYF-hYS)*hPr,0);
hpM.opacity=ss(0.05,0.4,pp);
var ohOp=ss(0.65,1.0,pp);oHB.material.opacity=ohOp;if(ohOp>0.01)oHB.userData.up(Op,hP.position);
var pE1S=new T.Vector3(1.05,0.4,0.05),pE2S=new T.Vector3(1.05,-0.4,-0.05);
var pE1A=new T.Vector3(Op.x,Op.y+0.4,0.05),pE2A=new T.Vector3(Op.x,Op.y-0.4,-0.05);
var emA=ss(0.2,0.8,ta);
var pE1Pos=new T.Vector3().lerpVectors(pE1S,pE1A,emA);
var pE2Pos=new T.Vector3().lerpVectors(pE2S,pE2A,emA);
var emP=ss(0.5,1.0,pp);

var s;
if(t<0.04)s='π-binding (delokalisert over C og O) · 2 e⁻ forskjøvet mot O';
else if(t<0.22)s='Nu nærmer seg · sikter mot π* nær C';
else if(t<0.45)s='π-MO fader · elektronene trekkes mot O sin p-orbital';

}
us();
var dr=false,lx=0,ly=0;
cv.addEventListener('pointerdown',function(e){dr=true;lx=e.clientX;ly=e.clientY;try{cv.setPointerCapture(e.pointerId)}catch(_){}})

var lb=[{i:'lC',f:function(){return Cp}},{i:'lO',f:function(){return Op}},{i:'lH1',f:function(){return H1p}},{i:'lH2',f:function(){return H2p}},{i:'lN',f:function(){return nG.position}},{i:'lHp',f:function(){return hP.position}}];
