<style>
@keyframes flick { 0%,100%{opacity:1} 50%{opacity:.78} }

}

<div class="hbctl"><span style="min-width:64px">Trykk</span><input id="P" type="range" min="50" max="400" step="10" value="200"><span id="Pv" style="min-width:64px;text-align:right">200 atm</span></div>
<div class="hbctl"><span style="min-width:64px">Temperatur</span><input id="T" type="range" min="200" max="600" step="10" value="450"><span id="Tv" style="min-width:64px;text-align:right">450 °C</span></div>

<div class="hbread">
<div class="hbcard"><div class="lab">Likevektsutbytte NH₃</div><div class="val" id="yv">18 %</div></div>
<div class="hbcard"><div class="lab">Reaksjonsfart (rel. 450 °C)</div><div class="val" id="rv">1,0×</div></div>
</div>

<script>
(function(){
  var P=document.getElementById('P'),T=document.getElementById('T');
  var Pv=document.getElementById('Pv'),Tv=document.getElementById('Tv');
  var yv=document.getElementById('yv'),rv=document.getElementById('rv');
  var feed=document.getElementById('feed'),flames=document.getElementById('flames');
  var glow=document.getElementById('glow');
  var prod=['p1','p2','p3','p4','p5','p6'].map(function(id){return document.getElementById(id);});
  function calc(){
    var p=+P.value, t=+T.value, tk=t+273;
    var y=90*(p/(p+180))*Math.exp(-(t-200)/260);
    y=Math.max(2,Math.min(96,y));
    var Ea=60000,R=8.314;
    var rate=Math.exp(-Ea/(R*tk))/Math.exp(-Ea/(R*723));
    Pv.textContent=p+' atm'; Tv.textContent=t+' °C';
    yv.textContent=Math.round(y)+' %';
    rv.textContent=(rate>=1?rate.toFixed(1):rate.toFixed(2)).replace('.',',')+'×';
    var c=1-(p-50)/350*0.42;
    feed.setAttribute('transform','translate(0,205) scale(1,'+c.toFixed(3)+') translate(0,-205)');
    var fs=0.4+(t-200)/400*1.0;
    flames.setAttribute('transform','scale(1,'+fs.toFixed(3)+')');
    flames.style.transformOrigin='center 356px';
    glow.setAttribute('opacity',(0.06+(t-200)/400*0.28).toFixed(3));
    var n=Math.round(y/100*6);
    prod.forEach(function(g,i){ g.style.transition='opacity .3s'; g.style.opacity=i<n?1:0.08; });
  }
  P.addEventListener('input',calc); T.addEventListener('input',calc); calc();
})();
</script>
