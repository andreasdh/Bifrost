  #sim-2niva-multiplisitet-a1c9 .tns-chart {

    align-items:flex-end;

  #sim-2niva-multiplisitet-a1c9 .tns-bar {

  #sim-2niva-multiplisitet-a1c9 .tns-bar.tns-current { background: var(--s2lm-accent-soft); }

  @media (max-width: 480px) {
    #sim-2niva-multiplisitet-a1c9 .tns-particles { padding: .75rem; }
    #sim-2niva-multiplisitet-a1c9 .tns-readout { gap: 1rem; }

</style>

<script>
(function () {
  const root = document.getElementById('sim-2niva-multiplisitet-a1c9');
  if (!root) return;

  root.innerHTML = `
    <div class="tns-head">
      <p class="tns-title tns-title-txt">To-nivå-system: mikrotilstander og multiplisitet</p>
    </div>
    <p class="tns-sub"></p>

    <div class="tns-controls">
      <div class="tns-slider-wrap">
        <label>Antall nivåer</label>
        <div class="tns-seg">
          <button type="button" data-m="2" aria-pressed="true">2</button>
          <button type="button" data-m="3" aria-pressed="false">3</button>
        </div>
      </div>
      <div class="tns-slider-wrap">
        <label>Antall partikler N</label>
        <input type="range" class="tns-N" min="2" max="16" value="8" step="1">
        <span class="tns-n-val">8</span>
      </div>
      <div class="tns-buttons">
        <button class="tns-btn" type="button" data-act="same-dist">Ny mikrotilstand (samme fordeling)</button>
        <button class="tns-btn" type="button" data-act="same-energy">Ny mikrotilstand (samme energi)</button>
        <button class="tns-btn" type="button" data-act="random">Helt tilfeldig</button>
        <button class="tns-btn" type="button" data-act="reset">Nullstill</button>
      </div>
    </div>

    <div class="tns-particles"></div>

    <div class="tns-readout"></div>

    <p class="tns-chart-title"></p>
    <div class="tns-chart-wrap">
      <span class="tns-yaxis-label">Multiplisitet</span>
      <div class="tns-chart-col">
        <div class="tns-chart"></div>
        <div class="tns-xaxis-label"></div>
      </div>
    </div>
    <p class="tns-note"></p>
  `;

  /* ---------- tilstand ---------- */
  const LEVEL_COLORS = ['#334155', '#d97706', '#dc2626'];
  const LEVEL_RINGS  = ['rgba(51,65,85,0.12)', 'rgba(217,119,6,0.15)', 'rgba(220,38,38,0.15)'];
  const LEVEL_NAMES  = ['0', '\u03B5', '2\u03B5'];

  let M = 2;                 // antall niv\u00E5er
  let N = 8;                 // antall partikler
  let state = [];            // state[i] = niv\u00E5indeks for partikkel i

  const FACT = [1];
  for (let i = 1; i <= 24; i++) FACT[i] = FACT[i - 1] * i;

  const nb = x => Math.round(x).toLocaleString('nb-NO');

  /* ---------- kombinatorikk ---------- */
  // Antall mikrotilstander for hver mulige totalenergi: koeffisientene i (1 + x + ... + x^(M-1))^N
  function omegaByEnergy(n, m) {
    let c = [1];
    for (let k = 0; k < n; k++) {
      const nc = new Array(c.length + m - 1).fill(0);
      for (let e = 0; e < c.length; e++) {
        if (c[e] === 0) continue;
        for (let j = 0; j < m; j++) nc[e + j] += c[e];
      }
      c = nc;
    }
    return c;
  }

  // Multiplisiteten til \u00E9n bestemt fordeling: N! / (n0! n1! ...)
  function multinomial(counts) {
    let d = 1;
    counts.forEach(c => { d *= FACT[c]; });
    return Math.round(FACT[counts.reduce((a, b) => a + b, 0)] / d);
  }

  // Alle fordelinger (n0, n1, ...) med gitt partikkeltall og gitt totalenergi
  function distsWithEnergy(n, m, E) {
    const res = [], cur = new Array(m).fill(0);
    (function rec(lvl, nLeft, eLeft) {
      if (lvl === 0) {
        if (eLeft === 0) { cur[0] = nLeft; res.push(cur.slice()); }
        return;
      }
      const maxc = Math.min(nLeft, Math.floor(eLeft / lvl));
      for (let c = 0; c <= maxc; c++) {
        cur[lvl] = c;
        rec(lvl - 1, nLeft - c, eLeft - c * lvl);
      }
      cur[lvl] = 0;
    })(m - 1, n, E);
    return res;
  }

  const counts = () => { const c = new Array(M).fill(0); state.forEach(l => c[l]++); return c; };
  const energy = () => state.reduce((a, b) => a + b, 0);

  /* ---------- tilstandsendringer ---------- */
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function setGround() { state = new Array(N).fill(0); }
  function setRandom() { state = Array.from({ length: N }, () => Math.floor(Math.random() * M)); }

  // ny mikrotilstand med n\u00F8yaktig samme fordeling p\u00E5 niv\u00E5ene
  function shuffleSameDistribution() { state = shuffle(state.slice()); }

  // ny mikrotilstand med samme totalenergi, trukket likt fordelt blant alle slike mikrotilstander
  function shuffleSameEnergy() {
    const dists = distsWithEnergy(N, M, energy());
    if (!dists.length) return;
    const w = dists.map(multinomial);
    const tot = w.reduce((a, b) => a + b, 0);
    let r = Math.random() * tot, pick = dists[dists.length - 1];
    for (let i = 0; i < dists.length; i++) { r -= w[i]; if (r <= 0) { pick = dists[i]; break; } }
    const levels = [];
    pick.forEach((c, lvl) => { for (let k = 0; k < c; k++) levels.push(lvl); });
    state = shuffle(levels);
  }

  /* ---------- tegning ---------- */
  function drawParticles() {
    const cont = root.querySelector('.tns-particles');
    const H = M === 2 ? 66 : 76, pad = 8;
    const y = lvl => H - pad - lvl * (H - 2 * pad) / (M - 1);
    cont.style.gap = M === 2 ? '8px' : '14px';
    const tip = M === 2 ? 'klikk for \u00E5 eksitere eller de-eksitere'
                        : 'klikk for \u00E5 flytte ett trinn opp';
    cont.innerHTML = state.map((lvl, i) => {
      const lines = [], labels = [];
      for (let k = 0; k < M; k++) {
        lines.push('<div class="tns-line" style="top:' + y(k) + 'px"></div>');
        labels.push('<span class="tns-lvl-label" style="top:' + y(k) + 'px">' + LEVEL_NAMES[k] + '</span>');
      }
      return '<div class="tns-particle" role="button" tabindex="0" data-i="' + i + '"' +
        ' style="height:' + H + 'px" title="Partikkel ' + (i + 1) + ': ' + tip + '">' +
        labels.join('') + lines.join('') +
        '<div class="tns-dot" style="top:' + y(lvl) + 'px; background:' + LEVEL_COLORS[lvl] +
        '; box-shadow: 0 0 0 3px ' + LEVEL_RINGS[lvl] + '"></div></div>';
    }).join('');
  }

  function microstateHTML() {
    if (M === 2) return state.map(l => l ? '\u2191' : '\u2193').join(' ');
    return state.map(l => '<span class="tns-lvl" style="color:' + LEVEL_COLORS[l] + '">' + l + '</span>').join(' ');
  }

  function drawReadout(c, E, omegaDist, omegaE) {
    const box = root.querySelector('.tns-readout');
    const metric = (label, value, cls) =>
      '<div class="tns-metric"><span class="tns-label">' + label + '</span>' +
      '<span class="tns-value ' + (cls || '') + '">' + value + '</span></div>';

    if (M === 2) {
      const n = c[1];
      const binom = '<span class="tns-binom"><span class="tns-binom-paren">(</span>' +
        '<span class="tns-binom-col"><span>' + N + '</span><span>' + n + '</span></span>' +
        '<span class="tns-binom-paren">)</span></span>';
      box.innerHTML =
        metric('Mikrotilstand', microstateHTML()) +
        metric('Makrotilstand (energi)', 'E = ' + n + '\u03B5 &nbsp;(' + n + ' av ' + N + ' eksitert)') +
        metric('Multiplisitet \u03A9(n)', '\u03A9(' + n + ') = ' + binom + ' = ' + nb(omegaDist), 'tns-omega');
      return;
    }

    const fracTop = N + '!';
    const fracBot = c.map(x => x + '!').join('\u00B7');
    box.innerHTML =
      metric('Mikrotilstand', microstateHTML()) +
      metric('Fordeling (n\u2080, n\u2081, n\u2082)', '(' + c.join(', ') + ')') +
      metric('Multiplisitet for fordelingen',
             nb(omegaDist) + ' <span class="tns-frac">= ' + fracTop + ' / (' + fracBot + ')</span>') +
      metric('Makrotilstand (energi)', 'E = ' + E + '\u03B5') +
      metric('\u03A9(E), alle fordelinger', nb(omegaE), 'tns-omega');
  }

  function drawChart(coeffs, E, omegaDist, omegaE) {
    const chart = root.querySelector('.tns-chart');
    const maxOmega = Math.max.apply(null, coeffs);
    const step = Math.ceil(coeffs.length / 18);
    chart.innerHTML = coeffs.map((c, k) => {
      const h = Math.max(3, (c / maxOmega) * 100);
      const isNow = k === E;
      const part = isNow && omegaE > 0
        ? '<div class="tns-bar-part" style="height:' + (omegaDist / omegaE * 100).toFixed(1) + '%"></div>' : '';
      const lab = (k % step === 0 || isNow) ? k : '&nbsp;';
      return '<div class="tns-bar-col">' +
        '<div class="tns-bar' + (isNow ? ' tns-current' : '') + '" style="height:' + h + '%">' + part + '</div>' +
        '<span class="tns-bar-n">' + lab + '</span></div>';
    }).join('');
  }

  function drawText(nDists) {
    root.querySelector('.tns-title-txt').textContent = M === 2
      ? 'To-niv\u00E5-system: mikrotilstander og multiplisitet'
      : 'Tre-niv\u00E5-system: mikrotilstander og multiplisitet';

    root.querySelector('.tns-sub').innerHTML = M === 2
      ? 'Hver partikkel kan v\u00E6re i grunntilstanden (energi 0) eller den eksiterte tilstanden (energi \u03B5). Klikk p\u00E5 en partikkel for \u00E5 eksitere eller de-eksitere den.'
      : 'Hver partikkel kan v\u00E6re p\u00E5 ett av tre niv\u00E5er med energi 0, \u03B5 og 2\u03B5. Klikk p\u00E5 en partikkel for \u00E5 flytte den ett trinn opp. Fra \u00F8verste niv\u00E5 faller den ned i grunntilstanden igjen.';

    root.querySelector('.tns-chart-title').textContent = M === 2
      ? 'Multiplisitet \u03A9(n) for hver mulig makrotilstand'
      : 'Multiplisitet \u03A9(E) for hver mulig totalenergi';

    root.querySelector('.tns-xaxis-label').textContent = M === 2
      ? 'Antall eksiterte partikler, n'
      : 'Total energi E (i enheter av \u03B5)';

    root.querySelector('.tns-note').innerHTML = M === 2
      ? 'Med to niv\u00E5er bestemmer energien fordelingen fullstendig: sier du at <b>n</b> partikler er eksitert, har du sagt alt om makrotilstanden.'
      : 'Med tre niv\u00E5er er ikke lenger energien og fordelingen det samme. Denne energien kan lages av <b>' +
        nDists + (nDists === 1 ? ' fordeling' : ' ulike fordelinger') +
        '</b>, og \u03A9(E) er summen av multiplisitetene deres. Den m\u00F8rke delen av den markerte s\u00F8ylen er bidraget fra fordelingen du har n\u00E5.';
  }

  function render() {
    const c = counts(), E = energy();
    const coeffs = omegaByEnergy(N, M);
    const omegaDist = multinomial(c);
    const omegaE = coeffs[E];
    const nDists = distsWithEnergy(N, M, E).length;

    drawParticles();
    drawReadout(c, E, omegaDist, omegaE);
    drawChart(coeffs, E, omegaDist, omegaE);
    drawText(nDists);
  }

  /* ---------- hendelser ---------- */
  function setM(m) {
    if (m === M) return;
    M = m;
    root.querySelectorAll('.tns-seg button').forEach(b =>
      b.setAttribute('aria-pressed', String(+b.dataset.m === M)));
    root.querySelector('[data-act="same-dist"]').style.display = M === 2 ? 'none' : '';
    state = state.map(l => Math.min(l, M - 1));
    render();
  }

  function act(a) {
    if (a === 'same-dist') shuffleSameDistribution();
    else if (a === 'same-energy') shuffleSameEnergy();
    else if (a === 'random') setRandom();
    else if (a === 'reset') setGround();
    render();
  }

  function bump(i) { state[i] = (state[i] + 1) % M; render(); }

  root.addEventListener('click', function (ev) {
    const seg = ev.target.closest('.tns-seg button');
    if (seg) { setM(+seg.dataset.m); return; }
    const btn = ev.target.closest('[data-act]');
    if (btn) { act(btn.dataset.act); return; }
    const p = ev.target.closest('.tns-particle');
    if (p) bump(+p.dataset.i);
  });

  root.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    const p = ev.target.closest('.tns-particle');
    if (p) { ev.preventDefault(); bump(+p.dataset.i); }
  });

  root.querySelector('.tns-N').addEventListener('input', function (e) {
    N = +e.target.value;
    root.querySelector('.tns-n-val').textContent = N;
    setGround();
    render();
  });

  root.querySelector('[data-act="same-dist"]').style.display = 'none';
  setGround();
  render();
})();
</script>
