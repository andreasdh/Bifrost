<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grignard-reagens: ladningsfordeling</title>
<style>
:root {
  --bg: #ffffff;
  --text-primary: #2C2C2A;
  --text-secondary: #5F5E5A;
  --border: #B4B2A9;

  --teal-fill: #E1F5EE; --teal-stroke: #0F6E56; --teal-text: #085041;
  --coral-fill: #FAECE7; --coral-stroke: #993C1D; --coral-text: #712B13;
  --gray-fill: #F1EFE8; --gray-stroke: #5F5E5A; --gray-text: #444441;

  --energy-color: #D85A30;
  --amber-mid: #BA7517;
  --arrow-color: #4A1B0C;
  --cloud-color: 29, 158, 117;
}

* { box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin: 0;
  padding: 32px 16px;
  display: flex;
  justify-content: center;
}

.card {
  max-width: 700px;
  width: 100%;
}

svg text {
  font-family: inherit;
  fill: var(--text-primary);
}

.th { font-size: 14px; font-weight: 600; }
.ts { font-size: 12px; fill: var(--text-secondary); }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

@keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.85; } }
@keyframes pulseGlow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
@keyframes flicker { 0%, 100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }

@media (prefers-reduced-motion: no-preference) {
  .e-cloud { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
  .bond-glow { animation: pulseGlow 2.4s ease-in-out infinite; transform-origin: center; }
  .bolt { animation: flicker 1.3s ease-in-out infinite; transform-origin: 322px 200px; }
}
</style>
</head>
<body>
<div class="card">
<h2 class="sr-only">Illustrasjon av ladningsforskyvning i metylmagnesiumbromid, med vekt på den energirike, polariserte C-Mg-bindingen</h2>
<svg width="100%" viewBox="0 0 680 470" role="img">
<title>Ladningsfordeling og bindingsenergi i Grignard-reagenset CH3MgBr</title>
<desc>Molekylskisse som viser at elektrontettheten trekkes fra Mg mot både C og Br. C-Mg-bindingen er fremhevet med en varm glød og et lynsymbol for å vise at den er svak, sterkt polarisert og energirik.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<linearGradient id="ecloud" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="rgb(var(--cloud-color))" stop-opacity="0.55"/>
<stop offset="55%" stop-color="rgb(var(--cloud-color))" stop-opacity="0.15"/>
<stop offset="100%" stop-color="rgb(var(--cloud-color))" stop-opacity="0"/>
</linearGradient>
<linearGradient id="ecloud2" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="rgb(var(--cloud-color))" stop-opacity="0"/>
<stop offset="45%" stop-color="rgb(var(--cloud-color))" stop-opacity="0.15"/>
<stop offset="100%" stop-color="rgb(var(--cloud-color))" stop-opacity="0.55"/>
</linearGradient>
</defs>

<!-- glød bak C-Mg-bindingen: viser at bindingen er energirik -->
<line class="bond-glow" x1="250" y1="150" x2="400" y2="150" stroke="var(--energy-color)" stroke-width="18" opacity="0.12"/>
<line class="bond-glow" x1="250" y1="150" x2="400" y2="150" stroke="var(--energy-color)" stroke-width="10" opacity="0.22"/>

<line x1="205" y1="100" x2="250" y2="150" stroke="var(--border)" stroke-width="1.5"/>
<line x1="205" y1="200" x2="250" y2="150" stroke="var(--border)" stroke-width="1.5"/>
<line x1="250" y1="220" x2="250" y2="150" stroke="var(--border)" stroke-width="1.5"/>

<!-- C-Mg-bindingen: tykkere og varmfarget for å vise energiinnhold -->
<line x1="250" y1="150" x2="400" y2="150" stroke="var(--energy-color)" stroke-width="3.5"/>
<line x1="400" y1="150" x2="540" y2="150" stroke="var(--border)" stroke-width="2"/>

<ellipse class="e-cloud" cx="310" cy="150" rx="105" ry="34" fill="url(#ecloud)"/>
<ellipse class="e-cloud" cx="470" cy="150" rx="95" ry="30" fill="url(#ecloud2)"/>

<circle cx="205" cy="100" r="12" fill="var(--gray-fill)" stroke="var(--gray-stroke)" stroke-width="0.5"/>
<text class="ts" x="205" y="100" text-anchor="middle" dominant-baseline="central" fill="var(--gray-text)">H</text>
<circle cx="205" cy="200" r="12" fill="var(--gray-fill)" stroke="var(--gray-stroke)" stroke-width="0.5"/>
<text class="ts" x="205" y="200" text-anchor="middle" dominant-baseline="central" fill="var(--gray-text)">H</text>
<circle cx="250" cy="222" r="12" fill="var(--gray-fill)" stroke="var(--gray-stroke)" stroke-width="0.5"/>
<text class="ts" x="250" y="222" text-anchor="middle" dominant-baseline="central" fill="var(--gray-text)">H</text>

<circle cx="250" cy="150" r="26" fill="var(--teal-fill)" stroke="var(--teal-stroke)" stroke-width="1"/>
<text class="th" x="250" y="150" text-anchor="middle" dominant-baseline="central" fill="var(--teal-text)">C</text>

<circle cx="400" cy="150" r="28" fill="var(--coral-fill)" stroke="var(--coral-stroke)" stroke-width="1"/>
<text class="th" x="400" y="150" text-anchor="middle" dominant-baseline="central" fill="var(--coral-text)">Mg</text>

<circle cx="540" cy="150" r="26" fill="var(--gray-fill)" stroke="var(--gray-stroke)" stroke-width="0.5"/>
<text class="th" x="540" y="150" text-anchor="middle" dominant-baseline="central" fill="var(--gray-text)">Br</text>

<text class="th" x="250" y="70" text-anchor="middle" fill="var(--teal-text)">&#948;&#8315;</text>
<text class="th" x="400" y="70" text-anchor="middle" fill="var(--coral-text)">&#948;&#8314;&#8314;</text>
<text class="th" x="540" y="70" text-anchor="middle" fill="var(--teal-text)">&#948;&#8315;</text>

<line x1="380" y1="115" x2="270" y2="115" stroke="var(--arrow-color)" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="382" y1="108" x2="382" y2="122" stroke="var(--arrow-color)" stroke-width="1.5"/>

<line x1="418" y1="115" x2="522" y2="115" stroke="var(--arrow-color)" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="418" y1="108" x2="418" y2="122" stroke="var(--arrow-color)" stroke-width="1.5"/>

<text class="ts" x="325" y="96" text-anchor="middle">elektroner trekkes</text>
<text class="ts" x="470" y="96" text-anchor="middle">elektroner trekkes</text>

<!-- energi-symbol på C-Mg-bindingen -->
<polygon class="bolt" points="332,178 316,204 325,204 310,228 336,200 325,200" fill="var(--amber-mid)"/>
<text class="th" x="325" y="248" text-anchor="middle">Svak, sterkt polarisert C&#8211;Mg-binding</text>
<text class="ts" x="325" y="266" text-anchor="middle">lav bindingsenergi &#8594; mye kjemisk energi tilgjengelig</text>

<line x1="150" y1="335" x2="600" y2="335" stroke="var(--border)" stroke-width="1"/>
<circle cx="297" cy="335" r="6" fill="var(--coral-fill)" stroke="var(--coral-stroke)" stroke-width="0.5"/>
<circle cx="437" cy="335" r="6" fill="var(--teal-fill)" stroke="var(--teal-stroke)" stroke-width="0.5"/>
<circle cx="483" cy="335" r="6" fill="var(--gray-fill)" stroke="var(--gray-stroke)" stroke-width="0.5"/>
<text class="ts" x="297" y="361" text-anchor="middle">Mg 1,3</text>
<text class="ts" x="437" y="361" text-anchor="middle">C 2,5</text>
<text class="ts" x="483" y="385" text-anchor="middle">Br 3,0</text>
<text class="ts" x="375" y="409" text-anchor="middle">Elektronegativitet (Pauling-skala)</text>

<text class="ts" x="340" y="435" text-anchor="middle">Mg trekkes i elektrontetthet fra to kanter samtidig</text>
<text class="ts" x="340" y="451" text-anchor="middle">- b&#229;de C&#8211;Mg og Mg&#8211;Br er sterkt polariserte</text>
</svg>
</div>
</body>
</html>
