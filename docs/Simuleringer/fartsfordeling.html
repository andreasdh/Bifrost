<div style="display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 8px; font-size: 12px; color: var(--text-secondary);">
  <span style="display: flex; align-items: center; gap: 5px;"><span style="width: 14px; height: 3px; border-radius: 2px; background: #2a78d6;"></span>N₂ ved 300 K</span>
  <span style="display: flex; align-items: center; gap: 5px;"><span style="width: 14px; height: 3px; border-radius: 2px; background: repeating-linear-gradient(90deg,#eb6834 0 5px,transparent 5px 9px);"></span>N₂ ved 600 K</span>
  <span style="display: flex; align-items: center; gap: 5px;"><span style="width: 14px; height: 3px; border-radius: 2px; background: repeating-linear-gradient(90deg,#1baf7a 0 2px,transparent 2px 5px);"></span>N₂ ved 1200 K</span>
</div>
<div style="position: relative; width: 100%; height: 320px;">
  <canvas id="mbTemp" role="img" aria-label="Maxwell-Boltzmann fartsfordeling for nitrogengass ved 300, 600 og 1200 kelvin. Høyere temperatur gir lavere og bredere kurve forskjøvet mot høyere farter.">Fordelingen flater ut og forskyves mot høyre når temperaturen øker; arealet under hver kurve er 1.</canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
(function(){
  const R = 8.314462618, M = 0.0280134;
  function f(v, T){
    const a = M/(2*Math.PI*R*T);
    return 4*Math.PI*Math.pow(a,1.5)*v*v*Math.exp(-M*v*v/(2*R*T));
  }
  const xs = [];
  for(let v=0; v<=2600; v+=10) xs.push(v);
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const ink = dark ? '#c3c2b7' : '#52514e';
  const muted = '#898781';
  const grid = dark ? '#2c2c2a' : '#e1e0d9';
  const mk = (T, color, dash) => ({
    label: T+' K',
    data: xs.map(v => ({x: v, y: f(v,T)*1000})),
    borderColor: color, borderWidth: 2, borderDash: dash,
    pointRadius: 0, tension: 0, fill: false
  });
  new Chart(document.getElementById('mbTemp'), {
    type: 'line',
    data: { datasets: [ mk(300,'#2a78d6',[]), mk(600,'#eb6834',[8,4]), mk(1200,'#1baf7a',[2,3]) ] },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'nearest', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => c.dataset.label + ': ' + c.parsed.y.toFixed(3) } }
      },
      scales: {
        x: { type: 'linear', min: 0, max: 2600,
             title: { display: true, text: 'Fart v (m/s)', color: ink, font: {size: 12} },
             ticks: { color: muted, font: {size: 11} }, grid: { display: false },
             border: { color: dark ? '#383835' : '#c3c2b7' } },
        y: { min: 0,
             title: { display: true, text: 'f(v)  (10⁻³ s/m)', color: ink, font: {size: 12} },
             ticks: { color: muted, font: {size: 11}, callback: v => v.toFixed(1) },
             grid: { color: grid, drawTicks: false },
             border: { display: false } }
      }
    }
  });
})();
</script>
