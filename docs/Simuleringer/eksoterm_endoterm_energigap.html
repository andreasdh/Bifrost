<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eksoterm og endoterm prosess</title>
<style>
:root {
  --bg: #ffffff;
  --text-primary: #2C2C2A;
  --text-secondary: #5F5E5A;
  --border: #B4B2A9;
  --line: #444441;
}

* { box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin: 0;
  padding: 32px 16px;
  display: flex;
  justify-content: center;
}

.card { max-width: 700px; width: 100%; }

svg text { font-family: inherit; fill: var(--text-primary); }
.th { font-size: 14px; font-weight: 600; }
.ts { font-size: 12px; fill: var(--text-secondary); }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

@keyframes jitterLg { 0%,100% { transform: translate(0,0); } 25% { transform: translate(3px,-2px); } 50% { transform: translate(-3px,2px); } 75% { transform: translate(2px,3px); } }
@keyframes jitterSm { 0%,100% { transform: translate(0,0); } 50% { transform: translate(1px,-1px); } }
@keyframes flowOut { 0%,100% { opacity: 0.4; transform: translateX(0); } 50% { opacity: 1; transform: translateX(6px); } }
@keyframes flowIn { 0%,100% { opacity: 0.4; transform: translateX(0); } 50% { opacity: 1; transform: translateX(-6px); } }

@media (prefers-reduced-motion: no-preference) {
  .j-lg { animation: jitterLg 1.1s ease-in-out infinite; transform-origin: center; }
  .j-sm { animation: jitterSm 1.6s ease-in-out infinite; transform-origin: center; }
  .f-out { animation: flowOut 1.8s ease-in-out infinite; }
  .f-in { animation: flowIn 1.8s ease-in-out infinite; }
}
</style>
</head>
<body>
<div class="card">
<h2 class="sr-only">Sammenligning av en eksoterm og en endoterm prosess: mikroskopisk bindingsstyrke, energigap mellom tilstandene, og makroskopisk varmestrøm til eller fra omgivelsene</h2>

<div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center">

<svg width="49%" style="min-width:280px" viewBox="0 0 300 480" role="img">
<title>Eksoterm prosess</title>
<desc>Reaktanter med svake bindinger og stor bevegelsesfrihet omdannes til produkter med sterke bindinger. Energien synker, og differansen frigjøres som varme til omgivelsene.</desc>
<defs><marker id="arrow-exo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="150" y="18" text-anchor="middle">Eksoterm prosess</text>

<rect x="10" y="35" width="115" height="95" rx="8" fill="none" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4 3"/>
<rect x="170" y="35" width="115" height="95" rx="8" fill="none" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="45" y1="65" x2="100" y2="65" stroke="var(--line)" stroke-width="1"/>
<line x1="45" y1="65" x2="72" y2="100" stroke="var(--line)" stroke-width="1"/>
<line x1="100" y1="65" x2="72" y2="100" stroke="var(--line)" stroke-width="1"/>
<line x1="205" y1="65" x2="260" y2="65" stroke="var(--line)" stroke-width="1.5"/>
<line x1="205" y1="65" x2="232" y2="100" stroke="var(--line)" stroke-width="1.5"/>
<line x1="260" y1="65" x2="232" y2="100" stroke="var(--line)" stroke-width="1.5"/>
<circle class="j-lg" cx="45" cy="65" r="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
<circle class="j-lg" cx="100" cy="65" r="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
<circle class="j-lg" cx="72" cy="100" r="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
<circle class="j-sm" cx="205" cy="65" r="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<circle class="j-sm" cx="260" cy="65" r="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<circle class="j-sm" cx="232" cy="100" r="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<line x1="128" y1="82" x2="167" y2="82" stroke="var(--line)" stroke-width="1.5" marker-end="url(#arrow-exo)"/>
<text class="ts" x="67" y="148" text-anchor="middle">Svake bindinger</text>
<text class="ts" x="227" y="148" text-anchor="middle">Sterke bindinger</text>

<text class="ts" x="15" y="172" text-anchor="start">Energi</text>
<text class="ts" x="100" y="188" text-anchor="middle">Reaktanter</text>
<line x1="60" y1="200" x2="140" y2="200" stroke="#993C1D" stroke-width="3"/>
<line x1="170" y1="270" x2="250" y2="270" stroke="#0F6E56" stroke-width="3"/>
<text class="ts" x="210" y="286" text-anchor="middle">Produkter</text>
<line x1="140" y1="200" x2="170" y2="270" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-exo)"/>
<text class="ts" x="177" y="238" text-anchor="start">&#916;E</text>

<rect x="15" y="345" width="270" height="105" rx="10" fill="none" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="25" y="362" text-anchor="start">Omgivelser</text>
<rect x="55" y="372" width="90" height="55" rx="8" fill="none" stroke="var(--line)" stroke-width="0.5"/>
<text class="th" x="100" y="400" text-anchor="middle" dominant-baseline="central">System</text>
<g class="f-out">
<line x1="148" y1="400" x2="245" y2="400" stroke="#993C1D" stroke-width="2" marker-end="url(#arrow-exo)"/>
<path d="M175,388 Q182,382 189,388" fill="none" stroke="#993C1D" stroke-width="1"/>
<path d="M175,412 Q182,406 189,412" fill="none" stroke="#993C1D" stroke-width="1"/>
</g>
<text class="ts" x="150" y="470" text-anchor="middle">Varme frigj&#248;res til omgivelsene</text>
</svg>

<svg width="49%" style="min-width:280px" viewBox="0 0 300 480" role="img">
<title>Endoterm prosess</title>
<desc>Væske med sterke interaksjoner omdannes til gass med svake interaksjoner. Energien øker, og differansen må tas opp som varme fra omgivelsene.</desc>
<defs><marker id="arrow-endo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="150" y="18" text-anchor="middle">Endoterm prosess</text>

<rect x="10" y="35" width="115" height="95" rx="8" fill="none" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4 3"/>
<rect x="170" y="35" width="115" height="95" rx="8" fill="none" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="45" y1="65" x2="100" y2="65" stroke="var(--line)" stroke-width="1.5"/>
<line x1="45" y1="65" x2="72" y2="100" stroke="var(--line)" stroke-width="1.5"/>
<line x1="100" y1="65" x2="72" y2="100" stroke="var(--line)" stroke-width="1.5"/>
<line x1="205" y1="65" x2="260" y2="65" stroke="var(--line)" stroke-width="1"/>
<line x1="205" y1="65" x2="232" y2="100" stroke="var(--line)" stroke-width="1"/>
<line x1="260" y1="65" x2="232" y2="100" stroke="var(--line)" stroke-width="1"/>
<circle class="j-sm" cx="45" cy="65" r="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<circle class="j-sm" cx="100" cy="65" r="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<circle class="j-sm" cx="72" cy="100" r="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<circle class="j-lg" cx="205" cy="65" r="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
<circle class="j-lg" cx="260" cy="65" r="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
<circle class="j-lg" cx="232" cy="100" r="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
<line x1="128" y1="82" x2="167" y2="82" stroke="var(--line)" stroke-width="1.5" marker-end="url(#arrow-endo)"/>
<text class="ts" x="67" y="148" text-anchor="middle">Sterke krefter</text>
<text class="ts" x="227" y="148" text-anchor="middle">Svake krefter</text>

<text class="ts" x="15" y="172" text-anchor="start">Energi</text>
<text class="ts" x="100" y="286" text-anchor="middle">V&#230;ske</text>
<line x1="60" y1="270" x2="140" y2="270" stroke="#0F6E56" stroke-width="3"/>
<line x1="170" y1="200" x2="250" y2="200" stroke="#993C1D" stroke-width="3"/>
<text class="ts" x="210" y="188" text-anchor="middle">Gass</text>
<line x1="140" y1="270" x2="170" y2="200" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-endo)"/>
<text class="ts" x="177" y="238" text-anchor="start">&#916;E</text>

<rect x="15" y="345" width="270" height="105" rx="10" fill="none" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="25" y="362" text-anchor="start">Omgivelser</text>
<rect x="55" y="372" width="90" height="55" rx="8" fill="none" stroke="var(--line)" stroke-width="0.5"/>
<text class="th" x="100" y="400" text-anchor="middle" dominant-baseline="central">System</text>
<g class="f-in">
<line x1="245" y1="400" x2="148" y2="400" stroke="#185FA5" stroke-width="2" marker-end="url(#arrow-endo)"/>
<path d="M189,388 Q182,382 175,388" fill="none" stroke="#185FA5" stroke-width="1"/>
<path d="M189,412 Q182,406 175,412" fill="none" stroke="#185FA5" stroke-width="1"/>
</g>
<text class="ts" x="150" y="470" text-anchor="middle">Varme tas opp fra omgivelsene</text>
</svg>

</div>
<p class="ts" style="text-align:center;margin:12px 0 0">Korall = h&#248;y energi, stor bevegelsesfrihet &#183; Turkis = lav energi, liten bevegelsesfrihet</p>
</div>
</body>
</html>
