<div id="tve3-root" style="font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; max-width: 640px; margin: 1.5rem auto; padding: 1.5rem; border: 1px solid #ddd; border-radius: 10px; background: #fafafa;">

  <div style="display:flex;align-items:center;gap:12px;margin:0 0 4px;">
    <label for="tve3-ratio" style="font-size:14px;color:#555;white-space:nowrap;">&Delta;&epsilon; / k<sub>B</sub>T</label>
    <input type="range" id="tve3-ratio" min="0.1" max="5" step="0.1" value="1" style="flex:1;" />
    <span id="tve3-ratio-out" style="font-size:14px;font-weight:600;min-width:30px;text-align:right;color:#222;">1.0</span>
  </div>
  <div style="display:flex;justify-content:space-between;font-size:11px;color:#888;margin:0 0 1.5rem;">
    <span>Lite gap / høy temperatur</span>
    <span>Stort gap / lav temperatur</span>
  </div>

  <div style="display:grid;grid-template-columns:1fr 200px;gap:20px;align-items:start;">

    <div id="tve3-ladder" style="position:relative;height:280px;"></div>

    <div>
      <div style="background:#f0efe9;border-radius:10px;padding:1rem;margin-bottom:12px;">
        <p style="font-size:13px;color:#555;margin:0 0 4px;">Tilgjengelige tilstander (t)</p>
        <p style="font-size:24px;font-weight:600;margin:0;color:#222;">5</p>
      </div>
      <div style="background:#f0efe9;border-radius:10px;padding:1rem;">
        <p style="font-size:13px;color:#555;margin:0 0 4px;">Effektivt tilgjengelige (Q)</p>
        <p id="tve3-qval" style="font-size:24px;font-weight:600;margin:0;color:#2a78d6;">-</p>
        <p id="tve3-qnote" style="font-size:12px;color:#888;margin:6px 0 0;min-height:16px;"></p>
      </div>
    </div>

  </div>
</div>

<script>
(function () {
  const t = 5;
  const box = document.getElementById('tve3-ladder');
  const slider = document.getElementById('tve3-ratio');
  const ratioOut = document.getElementById('tve3-ratio-out');
  const qval = document.getElementById('tve3-qval');
  const qnote = document.getElementById('tve3-qnote');
  const baseY = 260;
  const leftPx = 40;
  const widthPct = 0.58;

  for (let n = 0; n < t; n++) {
    const bar = document.createElement('div');
    bar.id = 'tve3-bar-' + n;
    bar.style.cssText = 'position:absolute;left:' + leftPx + 'px;background:#378ADD;opacity:0.55;border-radius:3px 3px 0 0;';
    box.appendChild(bar);

    const line = document.createElement('div');
    line.id = 'tve3-lvl-' + n;
    line.style.cssText = 'position:absolute;left:' + leftPx + 'px;height:2.5px;background:#222;border-radius:1px;';
    box.appendChild(line);

    const lab = document.createElement('div');
    lab.id = 'tve3-lab-' + n;
    lab.style.cssText = 'position:absolute;font-size:12px;color:#555;';
    lab.textContent = n + '\u0394\u03b5';
    box.appendChild(lab);
  }

  function render() {
    const x = parseFloat(slider.value);
    ratioOut.textContent = x.toFixed(1);

    const gapPx = 14 + x * 9;
    const widthPx = box.clientWidth * widthPct;
    const weights = [];
    for (let n = 0; n < t; n++) weights.push(Math.exp(-n * x));
    const Q = weights.reduce((a, b) => a + b, 0);

    for (let n = 0; n < t; n++) {
      const y = baseY - n * gapPx;
      const line = document.getElementById('tve3-lvl-' + n);
      line.style.top = y + 'px';
      line.style.width = widthPx + 'px';

      const h = Math.max(2, (gapPx - 6) * weights[n]);
      const bar = document.getElementById('tve3-bar-' + n);
      bar.style.width = widthPx + 'px';
      bar.style.height = h + 'px';
      bar.style.top = (y - h) + 'px';

      const lab = document.getElementById('tve3-lab-' + n);
      lab.style.left = (leftPx + widthPx + 12) + 'px';
      lab.style.top = (y - 8) + 'px';
    }

    qval.textContent = Q.toFixed(2);
    if (x <= 0.4) qnote.textContent = 'Q nærmer seg t';
    else if (x >= 4.5) qnote.textContent = 'Q nærmer seg 1';
    else qnote.textContent = '';
  }

  slider.addEventListener('input', render);
  render();
})();
</script>
