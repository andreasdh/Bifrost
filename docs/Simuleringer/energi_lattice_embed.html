<div id="energi-widget" style="
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: #ffffff;
  color: #1a1a1a;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1rem;
  border: 1px solid #e0e0e0;
  border-radius: 12px;
  max-width: 640px;
  margin: 0 auto;
  box-sizing: border-box;
">

  <p style="text-align:center; font-size: 13px; color: #666; margin: 0 0 1rem;">
    Klikk på en partikkel for å bytte mellom A og B. Juster energiene under for å se hvordan U endrer seg.
  </p>

  <svg id="energi-svg" width="320" height="320" viewBox="0 0 320 320" style="margin-bottom: 1.25rem;"></svg>

  <div style="display: flex; gap: 12px; margin-bottom: 1.5rem;">
    <button id="energi-reset" style="font-size: 14px; padding: 8px 16px; border-radius: 6px; border: 1px solid #b0b0b0; background: #f5f5f5; cursor: pointer;">Nullstill</button>
    <button id="energi-random" style="font-size: 14px; padding: 8px 16px; border-radius: 6px; border: 1px solid #b0b0b0; background: #f5f5f5; cursor: pointer;">Tilfeldig fordeling</button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; width: 100%; margin-bottom: 1.5rem;">
    <div style="background: #f4f4f4; border-radius: 8px; padding: 0.75rem; text-align: center;">
      <p style="font-size: 12px; color: #666; margin: 0 0 4px;">m<sub>AA</sub></p>
      <p style="font-size: 20px; font-weight: 600; margin: 0; color: #A32D2D;" id="energi-stat-maa">0</p>
    </div>
    <div style="background: #f4f4f4; border-radius: 8px; padding: 0.75rem; text-align: center;">
      <p style="font-size: 12px; color: #666; margin: 0 0 4px;">m<sub>BB</sub></p>
      <p style="font-size: 20px; font-weight: 600; margin: 0; color: #185FA5;" id="energi-stat-mbb">24</p>
    </div>
    <div style="background: #f4f4f4; border-radius: 8px; padding: 0.75rem; text-align: center;">
      <p style="font-size: 12px; color: #666; margin: 0 0 4px;">m<sub>AB</sub></p>
      <p style="font-size: 20px; font-weight: 600; margin: 0; color: #5F5E5A;" id="energi-stat-mab">0</p>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; background: #f4f4f4; border-radius: 8px; padding: 1rem 1.25rem; width: 100%; box-sizing: border-box; margin-bottom: 1.25rem;">

    <div>
      <div style="display:flex; justify-content:space-between; font-size: 13px; margin-bottom: 4px;">
        <span style="color: #A32D2D;">w<sub>AA</sub></span>
        <span id="energi-val-waa">-1.0</span>
      </div>
      <input type="range" id="energi-w-aa" min="-3" max="3" step="0.1" value="-1" style="width:100%;">
    </div>

    <div>
      <div style="display:flex; justify-content:space-between; font-size: 13px; margin-bottom: 4px;">
        <span style="color: #185FA5;">w<sub>BB</sub></span>
        <span id="energi-val-wbb">-1.0</span>
      </div>
      <input type="range" id="energi-w-bb" min="-3" max="3" step="0.1" value="-1" style="width:100%;">
    </div>

    <div>
      <div style="display:flex; justify-content:space-between; font-size: 13px; margin-bottom: 4px;">
        <span style="color: #5F5E5A;">w<sub>AB</sub></span>
        <span id="energi-val-wab">1.0</span>
      </div>
      <input type="range" id="energi-w-ab" min="-3" max="3" step="0.1" value="1" style="width:100%;">
    </div>

  </div>

  <div style="background: #f4f4f4; border-radius: 8px; padding: 1rem; text-align: center; width: 100%; box-sizing: border-box;">
    <p style="font-size: 13px; color: #666; margin: 0 0 4px;">U = m<sub>AA</sub>w<sub>AA</sub> + m<sub>BB</sub>w<sub>BB</sub> + m<sub>AB</sub>w<sub>AB</sub></p>
    <p style="font-size: 24px; font-weight: 700; margin: 0;" id="energi-stat-u">-24.0</p>
    <p style="font-size: 12px; color: #888; margin: 6px 0 0;" id="energi-formula-detail"></p>
  </div>

</div>

<script>
(function() {
  const SIZE = 4;
  const R = 24;
  const SPACING = 70;
  const OFFSET = 40;
  let cells = [];
  for (let r = 0; r < SIZE; r++) {
    cells.push(new Array(SIZE).fill('B'));
  }

  const COLOR_A_FILL = '#E24B4A';
  const COLOR_B_FILL = '#378ADD';
  const COLOR_AA = '#A32D2D';
  const COLOR_BB = '#185FA5';
  const COLOR_AB = '#5F5E5A';

  const svg = document.getElementById('energi-svg');
  const NS = 'http://www.w3.org/2000/svg';

  function pos(r, c) {
    return { x: OFFSET + c * SPACING, y: OFFSET + r * SPACING };
  }

  const hLines = {};
  const vLines = {};
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (c < SIZE - 1) {
        const p1 = pos(r, c), p2 = pos(r, c + 1);
        const line = document.createElementNS(NS, 'line');
        line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
        line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
        line.setAttribute('stroke-width', '2.5');
        svg.appendChild(line);
        hLines[r + '-' + c] = line;
      }
      if (r < SIZE - 1) {
        const p1 = pos(r, c), p2 = pos(r + 1, c);
        const line = document.createElementNS(NS, 'line');
        line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
        line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
        line.setAttribute('stroke-width', '2.5');
        svg.appendChild(line);
        vLines[r + '-' + c] = line;
      }
    }
  }

  const circles = {};
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const p = pos(r, c);
      const circle = document.createElementNS(NS, 'circle');
      circle.setAttribute('cx', p.x); circle.setAttribute('cy', p.y);
      circle.setAttribute('r', R);
      circle.setAttribute('stroke', '#00000022');
      circle.setAttribute('stroke-width', '0.5');
      circle.style.cursor = 'pointer';
      circle.dataset.r = r; circle.dataset.c = c;
      circle.addEventListener('click', () => {
        cells[r][c] = cells[r][c] === 'A' ? 'B' : 'A';
        render();
      });
      svg.appendChild(circle);
      circles[r + '-' + c] = circle;
    }
  }

  function bondColor(t1, t2) {
    if (t1 === 'A' && t2 === 'A') return COLOR_AA;
    if (t1 === 'B' && t2 === 'B') return COLOR_BB;
    return COLOR_AB;
  }

  function render() {
    let mAA = 0, mBB = 0, mAB = 0;

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const t = cells[r][c];
        const circle = circles[r + '-' + c];
        circle.setAttribute('fill', t === 'A' ? COLOR_A_FILL : COLOR_B_FILL);
      }
    }

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (c < SIZE - 1) {
          const t1 = cells[r][c], t2 = cells[r][c + 1];
          hLines[r + '-' + c].setAttribute('stroke', bondColor(t1, t2));
          if (t1 === 'A' && t2 === 'A') mAA++;
          else if (t1 === 'B' && t2 === 'B') mBB++;
          else mAB++;
        }
        if (r < SIZE - 1) {
          const t1 = cells[r][c], t2 = cells[r + 1][c];
          vLines[r + '-' + c].setAttribute('stroke', bondColor(t1, t2));
          if (t1 === 'A' && t2 === 'A') mAA++;
          else if (t1 === 'B' && t2 === 'B') mBB++;
          else mAB++;
        }
      }
    }

    document.getElementById('energi-stat-maa').textContent = mAA;
    document.getElementById('energi-stat-mbb').textContent = mBB;
    document.getElementById('energi-stat-mab').textContent = mAB;

    const wAA = parseFloat(document.getElementById('energi-w-aa').value);
    const wBB = parseFloat(document.getElementById('energi-w-bb').value);
    const wAB = parseFloat(document.getElementById('energi-w-ab').value);

    document.getElementById('energi-val-waa').textContent = wAA.toFixed(1);
    document.getElementById('energi-val-wbb').textContent = wBB.toFixed(1);
    document.getElementById('energi-val-wab').textContent = wAB.toFixed(1);

    const U = mAA * wAA + mBB * wBB + mAB * wAB;
    document.getElementById('energi-stat-u').textContent = U.toFixed(1);
    document.getElementById('energi-formula-detail').textContent =
      '(' + mAA + ')(' + wAA.toFixed(1) + ') + (' + mBB + ')(' + wBB.toFixed(1) + ') + (' + mAB + ')(' + wAB.toFixed(1) + ')';
  }

  document.getElementById('energi-w-aa').addEventListener('input', render);
  document.getElementById('energi-w-bb').addEventListener('input', render);
  document.getElementById('energi-w-ab').addEventListener('input', render);

  document.getElementById('energi-reset').addEventListener('click', () => {
    for (let r = 0; r < SIZE; r++) cells[r] = new Array(SIZE).fill('B');
    render();
  });

  document.getElementById('energi-random').addEventListener('click', () => {
    const flat = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) flat.push([r, c]);
    for (let i = flat.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [flat[i], flat[j]] = [flat[j], flat[i]];
    }
    const nA = Math.floor(Math.random() * (SIZE * SIZE + 1));
    for (let r = 0; r < SIZE; r++) cells[r] = new Array(SIZE).fill('B');
    for (let i = 0; i < nA; i++) {
      const [r, c] = flat[i];
      cells[r][c] = 'A';
    }
    render();
  });

  render();
})();
</script>
