name: Temporary solution dropdown cleanup

on:
  push:
    branches:
      - fix/solution-dropdowns-docs

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Convert and validate solution dropdowns
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          old_title = ':::{admonition} Løsningsforslag'
          known_preexisting_invalid = {
              'docs/arkiv/statmek_BACKUP_64692.ipynb',
          }

          changed_files = []
          converted_boxes = 0

          for path in sorted(Path('docs').rglob('*.ipynb')):
              text = path.read_text(encoding='utf-8')
              original = text

              # Keep notebook formatting untouched: replace only the directive line.
              text, count = re.subn(
                  r'":::\{admonition\} Løsningsforslag\\n"',
                  lambda _: '":::{dropdown} Løsningsforslag\\n"',
                  text,
              )
              converted_boxes += count

              # A true dropdown does not need an admonition class. Remove a class
              # source line only when it immediately follows this exact dropdown.
              pattern = re.compile(
                  r'(":::\{dropdown\} Løsningsforslag\\n",\n)(\s*)":class:[^"\\]*(?:\\.[^"\\]*)*\\n",\n'
              )
              text = pattern.sub(lambda m: m.group(1), text)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed_files.append(path.as_posix())

          # QA: all normal notebooks must still be valid JSON. The one known archive
          # backup is already invalid on main because it contains Git conflict markers.
          invalid_unexpected = []
          leftovers = []
          valid_count = 0
          for path in sorted(Path('docs').rglob('*.ipynb')):
              name = path.as_posix()
              text = path.read_text(encoding='utf-8')
              try:
                  json.loads(text)
                  valid_count += 1
              except Exception as exc:
                  if name not in known_preexisting_invalid:
                      invalid_unexpected.append(f'{name}: {exc}')
              if old_title in text:
                  leftovers.append(name)

          if invalid_unexpected:
              raise SystemExit('Unexpected invalid notebook JSON:\n' + '\n'.join(invalid_unexpected))
          if leftovers:
              raise SystemExit('Old solution admonitions remain:\n' + '\n'.join(leftovers))

          print(f'Converted {converted_boxes} solution box(es) in {len(changed_files)} notebook(s).')
          for name in changed_files:
              print(name)
          print(f'Validated {valid_count} notebook(s) as JSON.')
          print('Known pre-existing conflicted backup exempted: docs/arkiv/statmek_BACKUP_64692.ipynb')
          print('No old Løsningsforslag admonitions remain under docs/.')
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp_solution_dropdowns_docs.yml
          git add docs
          git commit -m "Use robust dropdowns for solution boxes in docs"
          git push origin HEAD:fix/solution-dropdowns-docs
