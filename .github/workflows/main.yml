# Uses Jupyter Book v1.x.
# Do not upgrade to Jupyter Book 2/MyST without updating the build workflow.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: bifrost-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore Jupyter execution cache
        uses: actions/cache@v4
        with:
          path: _build/.jupyter_cache
          key: jupyter-cache-${{ runner.os }}-${{ hashFiles('requirements.txt', '_config.yml', '_toc.yml', '**/*.ipynb') }}
          restore-keys: |
            jupyter-cache-${{ runner.os }}-

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Build Jupyter Book
        run: jupyter-book build .

      - name: Deploy to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force_orphan: true
          publish_dir: ./_build/html
