# Uses Jupyter Book v1.x.
# Do not upgrade to Jupyter Book 2/MyST without updating the build workflow.
name: CI

on:
  push:
    branches:
      - main
      - fix/jupyter-book-warnings
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bifrost-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore original gas simulation for PR 16
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/restore-original-gas-simulation-2'
        run: |
          git fetch origin main fix/restore-original-gas-simulation-2
          git checkout -B fix/restore-original-gas-simulation-2 origin/fix/restore-original-gas-simulation-2
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('docs/4_gasser.ipynb')
          text = path.read_text(encoding='utf-8')
          old = 'Simuleringer/Simulering2_trykk_energi_entropi_3D.html'
          new = 'simuleringer/idealgassloven-simulering.html'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one old simulation reference, found {count}')
          text = text.replace(old, new)
          json.loads(text)
          path.write_text(text, encoding='utf-8')
          PY
          git checkout origin/main -- .github/workflows/main.yml
          git rm -f .github/workflows/temp_restore_original_gas_sim_2.yml || true
          git rm -f .github/temp_restore_original_gas_sim_2.trigger || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/4_gasser.ipynb .github/workflows/main.yml
          git commit -m "Restore original ideal gas simulation in gas chapter"
          git push origin HEAD:fix/restore-original-gas-simulation-2

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Migrate active simulation embeds
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/jupyter-book-warnings'
        run: |
          python migrate_simulation_embeds.py
          if ! git diff --quiet -- '*.ipynb'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git diff --name-only -- '*.ipynb' | while IFS= read -r file; do
              git add -- "$file"
            done
            git commit -m "Migrate active simulation embeds to IFrame"
            git push origin HEAD:fix/jupyter-book-warnings
          fi

      - name: Prepare static deployment build
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("_config.yml")
          config = config_path.read_text(encoding="utf-8")
          config = config.replace("execute_notebooks: auto", "execute_notebooks: off")
          config_path.write_text(config, encoding="utf-8")

          # Correct heading hierarchy in the active maths appendix.
          maths_path = Path("docs/matematikk/formler_og_enheter.ipynb")
          maths = json.loads(maths_path.read_text(encoding="utf-8"))
          heading_fixes = {
              "#### 1.2.1 Mengder, delmengder og elementer": "### 1.2.1 Mengder, delmengder og elementer",
              "#### 1.2.2 Mengdenotasjon": "### 1.2.2 Mengdenotasjon",
              "#### 1.2.3 Tallmengder": "### 1.2.3 Tallmengder",
              "#### 1.4.1 Tabeller med enheter og konstanter": "### 1.4.1 Tabeller med enheter og konstanter",
              "#### 1.4.2 Dimensjonsanalyse": "### 1.4.2 Dimensjonsanalyse",
          }
          for cell in maths["cells"]:
              if cell.get("cell_type") != "markdown":
                  continue
              source = cell.get("source", [])
              if isinstance(source, str):
                  for old, new in heading_fixes.items():
                      source = source.replace(old, new)
                  cell["source"] = source
              else:
                  cell["source"] = [
                      heading_fixes.get(line.rstrip("\n"), line.rstrip("\n")) + ("\n" if line.endswith("\n") else "")
                      for line in source
                  ]
          maths_path.write_text(
              json.dumps(maths, ensure_ascii=False, indent=1) + "\n",
              encoding="utf-8",
          )

          notebook_path = Path("docs/ukesoppgaver/uke_05.ipynb")
          notebook = json.loads(notebook_path.read_text(encoding="utf-8"))
          embeds = {
              "e6362293": "../Simuleringer/Simulering_varmekapasitet_entalpi_CV_Cp.html",
              "bb7ddecc": "../Simuleringer/Simulering_fri_energi_spontanitet.html",
          }

          for cell in notebook["cells"]:
              cell_id = cell.get("id")
              src = embeds.get(cell_id)
              if src is None:
                  continue
              cell.clear()
              cell.update(
                  {
                      "cell_type": "markdown",
                      "id": cell_id,
                      "metadata": {},
                      "source": [
                          f'<iframe src="{src}" width="100%" height="720" '
                          'style="border: 0;" loading="lazy"></iframe>'
                      ],
                  }
              )

          notebook_path.write_text(
              json.dumps(notebook, ensure_ascii=False, indent=1) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build Jupyter Book
        run: jupyter-book build .

      - name: Copy static notebook assets
        run: |
          mkdir -p _build/html/docs/ukesoppgaver
          cp -a docs/Simuleringer _build/html/docs/Simuleringer
          cp -a docs/bilder _build/html/docs/bilder
          find docs/ukesoppgaver -maxdepth 1 -type f -name '*.html' -exec cp {} _build/html/docs/ukesoppgaver/ \;

      - name: Deploy to gh-pages
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force_orphan: true
          publish_dir: ./_build/html
