# Uses Jupyter Book v1.x.
# Do not upgrade to Jupyter Book 2/MyST without updating the build workflow.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: bifrost-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Prepare static deployment build
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("_config.yml")
          config = config_path.read_text(encoding="utf-8")
          config = config.replace("execute_notebooks: auto", "execute_notebooks: off")
          config_path.write_text(config, encoding="utf-8")

          notebook_path = Path("docs/ukesoppgaver/uke_05.ipynb")
          notebook = json.loads(notebook_path.read_text(encoding="utf-8"))
          embeds = {
              "e6362293": "../Simuleringer/Simulering_varmekapasitet_entalpi_CV_Cp.html",
              "bb7ddecc": "../Simuleringer/Simulering_fri_energi_spontanitet.html",
          }

          for cell in notebook["cells"]:
              src = embeds.get(cell.get("id"))
              if src is None:
                  continue
              cell.clear()
              cell.update(
                  {
                      "cell_type": "markdown",
                      "id": next(key for key, value in embeds.items() if value == src),
                      "metadata": {},
                      "source": [
                          f'<iframe src="{src}" width="100%" height="720" '
                          'style="border: 0;" loading="lazy"></iframe>'
                      ],
                  }
              )

          notebook_path.write_text(
              json.dumps(notebook, ensure_ascii=False, indent=1) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build Jupyter Book
        run: jupyter-book build .

      - name: Deploy to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force_orphan: true
          publish_dir: ./_build/html
