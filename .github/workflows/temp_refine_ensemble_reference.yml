name: Temporary ensemble reference refinement

on:
  push:
    branches:
      - pedagogisk-revisjon-partisjon-gasser
    paths:
      - scripts/temp_refine_ensemble_reference.py

permissions:
  contents: write

jobs:
  update-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pedagogisk-revisjon-partisjon-gasser
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update notebook
        run: python scripts/temp_refine_ensemble_reference.py
      - name: Commit notebook update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/A1_grunnleggende_begreper.ipynb
          if git diff --cached --quiet; then
            echo "No notebook changes"
          else
            git commit -m "Refine ensemble section as reference material"
            git push
          fi
