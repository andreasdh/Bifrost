name: Temporary gas chapter fix

on:
  push:
    branches:
      - fix/gasser-dropdown-simuleringer

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply gas chapter fixes
        run: python scripts/temp_fix_gasser_dropdowns.py

      - name: Remove temporary helper files
        run: |
          rm scripts/temp_fix_gasser_dropdowns.py
          rm .github/workflows/temp_fix_gasser_dropdowns.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/4_gasser.ipynb scripts/temp_fix_gasser_dropdowns.py .github/workflows/temp_fix_gasser_dropdowns.yml
          git commit -m "Fix gas chapter dropdowns and simulation embeds"
          git push origin HEAD:fix/gasser-dropdown-simuleringer
