name: Migrate iframe embeds

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'fix/simulation-iframes'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: fix/simulation-iframes

      - name: Migrate active notebooks
        run: |
          python migrate_simulation_embeds.py
          if ! git diff --quiet -- '*.ipynb'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git diff --name-only -- '*.ipynb' | while IFS= read -r file; do
              git add -- "$file"
            done
            git commit -m "Migrate active simulation embeds to IFrame"
            git push origin HEAD:fix/simulation-iframes
          fi
