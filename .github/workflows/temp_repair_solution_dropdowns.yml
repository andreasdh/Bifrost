name: Temporary repair solution dropdowns

on:
  push:
    branches:
      - fix/gasser-dropdown-simuleringer

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Repair and validate solution dropdowns
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          changed_files = []
          old_title = ':::{admonition} Løsningsforslag'
          known_preexisting_invalid = {
              'docs/arkiv/statmek_BACKUP_64692.ipynb',
          }

          for path in sorted(Path('docs').rglob('*.ipynb')):
              text = path.read_text(encoding='utf-8')
              original = text

              # Repair malformed literal newline introduced by the previous raw-text pass.
              text = text.replace(
                  '":::{dropdown} Løsningsforslag\n"',
                  '":::{dropdown} Løsningsforslag\\n"',
              )

              # Convert any remaining old directive with literal JSON escaping preserved.
              text = text.replace(
                  '":::{admonition} Løsningsforslag\\n"',
                  '":::{dropdown} Løsningsforslag\\n"',
              )

              # Remove an old admonition class line only when it immediately follows
              # a Løsningsforslag dropdown. Lambda preserves backslashes literally.
              pattern = re.compile(
                  r'(":::\{dropdown\} Løsningsforslag\\n",\n)(\s*)":class:[^"\\]*(?:\\.[^"\\]*)*\\n",\n'
              )
              text = pattern.sub(lambda m: m.group(1), text)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed_files.append(path.as_posix())

          invalid_unexpected = []
          leftovers = []
          valid_count = 0
          for path in sorted(Path('docs').rglob('*.ipynb')):
              name = path.as_posix()
              text = path.read_text(encoding='utf-8')
              try:
                  json.loads(text)
                  valid_count += 1
              except Exception as exc:
                  if name not in known_preexisting_invalid:
                      invalid_unexpected.append(f'{name}: {exc}')
              if old_title in text:
                  leftovers.append(name)

          if invalid_unexpected:
              raise SystemExit('Unexpected invalid notebook JSON:\n' + '\n'.join(invalid_unexpected))
          if leftovers:
              raise SystemExit('Old solution admonitions remain:\n' + '\n'.join(leftovers))

          print(f'Repaired {len(changed_files)} notebook(s).')
          for name in changed_files:
              print(name)
          print(f'Validated {valid_count} notebook(s) as JSON.')
          print('Only the known pre-existing conflicted backup is exempted.')
          print('No old Løsningsforslag admonitions remain under docs/.')
          PY

      - name: Commit repairs and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp_repair_solution_dropdowns.yml
          git add docs
          git commit -m "Repair and validate solution dropdown conversion"
          git push origin HEAD:fix/gasser-dropdown-simuleringer
