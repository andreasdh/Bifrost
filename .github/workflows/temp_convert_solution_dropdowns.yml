name: Temporary normalize solution dropdowns

on:
  push:
    branches:
      - fix/gasser-dropdown-simuleringer

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Convert Løsningsforslag admonitions to dropdowns
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          title_old = ':::{admonition} Løsningsforslag'

          changed_files = []
          total_boxes = 0

          # Work on the raw notebook JSON so everything outside the targeted
          # source lines stays byte-for-byte unchanged.
          for path in sorted(Path('docs').rglob('*.ipynb')):
              text = path.read_text(encoding='utf-8')
              original = text

              # Source arrays: replace the directive title.
              text, n = re.subn(
                  r'":::\{admonition\} Løsningsforslag\\n"',
                  '":::{dropdown} Løsningsforslag\\n"',
                  text,
              )

              # Remove only an old :class: line directly following the converted title.
              text = re.sub(
                  r'(":::\{dropdown\} Løsningsforslag\\n",\n)(\s*)":class:[^"\\]*(?:\\.[^"\\]*)*\\n",\n',
                  r'\1',
                  text,
              )

              # Also handle cells whose source is stored as one JSON string.
              text, n_single = re.subn(
                  r':::\{admonition\} Løsningsforslag\\n(?::class:[^\\n]*\\n)?',
                  ':::{dropdown} Løsningsforslag\\n',
                  text,
              )
              n += n_single

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed_files.append(path.as_posix())
                  total_boxes += n

          print(f'Converted {total_boxes} solution box(es) in {len(changed_files)} notebook(s).')
          for name in changed_files:
              print(name)

          leftovers = []
          for path in Path('docs').rglob('*.ipynb'):
              if title_old in path.read_text(encoding='utf-8'):
                  leftovers.append(path.as_posix())
          if leftovers:
              raise SystemExit('Unconverted solution admonitions remain: ' + ', '.join(leftovers))
          PY

      - name: Commit notebook changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp_convert_solution_dropdowns.yml
          git add docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use robust dropdowns for solution boxes in docs"
          git push origin HEAD:fix/gasser-dropdown-simuleringer
