name: Fix heading hierarchy

on:
  push:
    branches:
      - agent/fix-myst-notebook-warnings

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-myst-notebook-warnings

      - name: Fix hierarchy and validate target notebooks
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/Termokjemi_oppgaver.ipynb')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('### Diskusjonsoppgaver ', '## Diskusjonsoppgaver '),
              ('### Regneoppgaver ', '## Regneoppgaver '),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          targets = [
              Path('docs/Likevekter_oppgaver.ipynb'),
              Path('docs/Termokjemi_oppgaver.ipynb'),
              Path('docs/Termokjemi_oppgaver_løsningsforslag.ipynb'),
              Path('docs/faser.ipynb'),
          ]
          for target in targets:
              json.loads(target.read_text(encoding='utf-8'))
              print(f'valid JSON: {target}')
          PY

      - name: Commit fixes and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/fix-heading-hierarchy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Termokjemi_oppgaver.ipynb .github/workflows/fix-heading-hierarchy.yml
          git commit -m "Fix thermochemistry heading hierarchy"
          git push
