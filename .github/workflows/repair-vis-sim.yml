name: Repair vis_sim calls

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/simulation-iframes'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: fix/simulation-iframes

      - name: Restore simulation calls
        run: |
          python repair_vis_sim_calls.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --name-only -- '*.ipynb' | while IFS= read -r file; do
            git add -- "$file"
          done
          if ! git diff --cached --quiet; then
            git commit -m "Restore vis_sim calls after IFrame migration"
            git push origin HEAD:fix/simulation-iframes
          fi
